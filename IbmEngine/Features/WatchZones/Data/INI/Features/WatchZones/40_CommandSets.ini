; IBM Engine WatchZones pack: the power buttons on the buildings. Retail sets are overrides: slots
; not listed stay retail. Loads after 30_Powers.ini, which defines the buttons.

; USA airfields: slots 5 and 6 are empty in retail.
CommandSet AmericaAirfieldCommandSet
   5 = Command_IbmWatchRaptorPatrol
   6 = Command_IbmWatchA10Watch
End

CommandSet AirF_AmericaAirfieldCommandSet
   5 = Command_IbmWatchRaptorPatrol
   6 = Command_IbmWatchA10Watch
End

