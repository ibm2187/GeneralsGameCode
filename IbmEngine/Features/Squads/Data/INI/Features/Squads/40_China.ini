; Commando: Infiltrators. 1 lead, 2 gunners, 1 missile gunner. One at a time.
ObjectCopy IbmChinaInfiltrators GLAInfantryAngryMobNexus
  SelectPortrait = SNBlkLotus_L2
  ButtonImage = SNBlkLotus2
  UpgradeCameo1 = Upgrade_Nationalism
  UpgradeCameo2 = Upgrade_InfantryCaptureBuilding
  UpgradeCameo3 = Upgrade_Nationalism
  UpgradeCameo4 = Upgrade_Nationalism
  DisplayName = OBJECT:IbmChinaInfiltrators
  Side = China
  RadarPriority = NOT_ON_RADAR
  MaxSimultaneousOfType = 1
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmSquadTargetAllWeapon
  End
  BuildCost = 2000
  BuildTime = 30.0
  Prerequisites
    Object = ChinaBarracks
    Object = ChinaPropagandaCenter
  End
  CommandSet = IbmChinaInfiltratorsCommandSet
  VoiceSelect = BlackLotusVoiceSelect
  VoiceMove = BlackLotusVoiceMove
  VoiceGuard = BlackLotusVoiceMove
  VoiceAttack = BlackLotusVoiceMove
  SoundAmbient = NoSound
  UnitSpecificSounds
    VoiceCreate = BlackLotusVoiceCreate
  End
  ReplaceModule ModuleTag_05
    Behavior = SpawnBehavior IbmSquadTag_Spawn
      SpawnNumber = 4
      SpawnTemplateName = IbmChinaInfiltratorLead
      SpawnTemplateName = IbmChinaInfiltratorMissileGunner
      SpawnTemplateName = IbmChinaInfiltratorGunner
      SpawnTemplateName = IbmChinaInfiltratorGunner
      InitialBurst = 4
      OneShot = Yes
      ExitByBudding = Yes
      AggregateHealth = Yes
      SlavesHaveFreeWill = No
    End
  End
  AddModule
    Behavior = IbmSquadUpdate IbmSquadTag_Squad
      StealthWithMembers = Yes
      ReinforceAt = ChinaBarracks
      ReinforceRadius = 200
    End
    Behavior = StealthUpdate IbmSquadTag_LeaderStealth  ; only while every member is hidden (IbmSquadUpdate)
      StealthDelay = 100
      InnateStealth = No
    End
  End
End
