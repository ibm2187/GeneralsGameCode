; CoH VehicleMovement: the tuning. See CoH/Features/VehicleMovement/README.md for what each setting does.
;
; Every ground vehicle has a weight in tons. Its weight sets five factors on its retail handling, read
; off the curves below; a 30-ton vehicle (the Medium class) handles as in retail on flat ground,
; but tanks' top speed is a little lower.
; Helicopters, jets and hover vehicles are left alone.

CoHVehicleMovement
  ; ---- Weight ------------------------------------------------------------------------------------

  ; Class = <name> <tons>
  Class = Light 6
  Class = Medium 30
  Class = Heavy 45
  Class = SuperHeavy 70

  ; A vehicle no Unit line names weighs this class.
  DefaultClass = Medium

  ; Unit = <object> <class or tons>. A line covers the generals' versions too (AmericaTankCrusader
  ; covers Lazr_AmericaTankCrusader); a general's unit may have a line of its own.

  ; USA
  Unit = AmericaVehicleHumvee Light
  Unit = AmericaVehicleMedic 8
  Unit = AmericaVehicleTomahawk 16
  Unit = AmericaVehicleDozer 20
  Unit = AmericaTankCrusader Medium
  Unit = AmericaTankAvenger Medium
  Unit = AmericaTankMicrowave 28
  Unit = AmericaTankPaladin Heavy
  Unit = AmericaVehicleSentryDrone 1
  Unit = AmericaVehicleBattleDrone 1
  Unit = AmericaVehicleScoutDrone 1
  Unit = AmericaVehicleHellfireDrone 1
  Unit = AmericaVehicleSpyDrone 1
  Unit = AmericaVehicleGuardianDrone 1
  Unit = AmericaVehiclePointDefenseDrone 1
  Unit = AmericaVehicleRepairDrone 1

  ; China
  Unit = ChinaVehicleSupplyTruck 10
  Unit = ChinaVehicleDozer 20
  Unit = ChinaVehicleListeningOutpost 10
  Unit = ChinaVehicleTroopCrawler 14
  Unit = ChinaVehicleTroopCrawlerEmpty 14
  Unit = ChinaVehicleInfernoCannon 18
  Unit = ChinaTankGattling 28
  Unit = ChinaTankDragon Medium
  Unit = ChinaTankECM 28
  Unit = ChinaTankBattleMaster 32
  Unit = ChinaVehicleNukeLauncher 40
  Unit = ChinaTankOverlord SuperHeavy
  Unit = ChinaTankEmperor 80

  ; GLA
  Unit = GLAVehicleCombatBike 0.5
  Unit = GLAVehicleCombatBikeRocket 0.5
  Unit = GLAVehicleCombatBikeTerrorist 0.5
  Unit = GLAVehicleRocketBuggy 2
  Unit = GLAVehicleTechnical 3
  Unit = GLAVehicleTechnicalChassisOne 3
  Unit = GLAVehicleTechnicalChassisTwo 3
  Unit = GLAVehicleTechnicalChassisThree 3
  Unit = GLAVehicleRadarVan Light
  Unit = GLAVehicleQuadCannon 8
  Unit = GLAVehicleToxinTruck 8
  Unit = GLAVehicleBombTruck 8
  Unit = GLAVehicleBattleBus 12
  Unit = GLAVehicleDozer 20
  Unit = GLAVehicleScudLauncher 20
  Unit = GLAVehicleScudLauncherHiDef 20
  Unit = GLALightTank 18
  Unit = GLATankScorpion 20
  Unit = GLATankMarauder 38

  ; The boss general's (challenge) copies
  Unit = TankPaladin Heavy
  Unit = TankAvenger Medium
  Unit = TankGattling 28
  Unit = TankDragon Medium
  Unit = TankOverlord SuperHeavy
  Unit = VehicleTomahawk 16
  Unit = VehicleDozer 20
  Unit = VehicleSupplyTruck 10
  Unit = VehicleRocketBuggy 2
  Unit = VehicleCombatBikeTerrorist 0.5
  Unit = VehicleSentryDrone 1

  ; Upgrade = <upgrade> <tons>. An object upgrade weighs on the vehicle that has it (bought, or fitted
  ; by Tank loadouts); a player upgrade on each vehicle it changes.
  Upgrade = Upgrade_AmericaCompositeArmor 4
  Upgrade = Upgrade_ChinaOverlordGattlingCannon 3
  Upgrade = Upgrade_ChinaOverlordPropagandaTower 3
  Upgrade = Upgrade_ChinaOverlordBattleBunker 6
  Upgrade = Upgrade_GLAScorpionRocket 1

  ; ---- Handling ----------------------------------------------------------------------------------

  ; <Value> = <tons> <percent> ...: straight lines between the points, flat beyond the ends.
  ; Tanks a little slower than retail (the user, 2026-10-19): 100% at 18 t, so a Scorpion is about
  ; retail and a Crusader 94%.
  Speed        = 0.5 120%  6 112%  18 100%  30 94%  45 88%  70 78%  80 74%
  Acceleration = 0.5 170%  6 150%  30 100%  45 80%  70 55%  80 50%
  Braking      = 0.5 160%  6 140%  30 100%  45 85%  70 65%  80 60%
  TurnRate     = 0.5 130%  6 125%  30 100%  45 88%  70 72%  80 68%

  ; Going uphill: the share of speed lost on a 100% grade (a 20% grade loses a fifth of it), never
  ; below SlopeMinSpeed. The grade is measured SlopeLookAhead ahead of the vehicle. Downhill keeps
  ; the speed.
  SlopePenalty = 0.5 20%  6 40%  30 90%  45 110%  70 150%  80 160%
  SlopeMinSpeed = 40%
  SlopeLookAhead = 20.0

  ; ---- Ground ------------------------------------------------------------------------------------

  ; Surface = <name> <wheels> <treads>: top speed on it, for wheeled vehicles (and motorcycles) and for
  ; tracked ones. Wheels gain more on roads and lose more off them; tanks hardly care.
  Surface = Paved    120% 105%
  Surface = Track    110% 102%
  Surface = Open     100% 100%
  Surface = Sand      85%  95%
  Surface = Rock      80%  90%
  Surface = Snow      90%  95%
  Surface = DeepSnow  75%  85%

  ; Ground under the map's tiles. Tile = <start of a Terrain.ini texture's name> <surface> wins over
  ; Ground = <Terrain.ini Class> <surface>; anything else is DefaultSurface. Desert sand is open
  ; ground: deserts are made of it.
  Tile = Asphalt Paved
  Tile = BridgeAsphalt Paved
  Tile = ParkingLot Paved
  Tile = Concrete Paved
  Tile = Cobble Track
  Tile = SandRoadTransition Track
  Tile = Rock Rock
  Tile = Cliff Rock
  Tile = DirtSnow Snow
  Ground = ASPHALT Paved
  Ground = CONCRETE Paved
  Ground = URBAN Paved
  Ground = BEACH_TROPICAL Sand
  Ground = MOUNTAIN_RUGGED Rock
  Ground = ROCK_ACCENT Rock
  Ground = SNOW_FLAT Snow
  Ground = SNOW_RUGGED DeepSnow
  DefaultSurface = Open

  ; The map's roads, drawn over the tiles: Road = <start of a Roads.ini road's name> <surface>. Roads
  ; no line names (arrows, cracks, crossings, rails and other decals) leave the ground as it is.
  Road = TwoLane Paved
  Road = FourLane Paved
  Road = Cobblestone Track
  Road = DirtRoad Track
  Road = GravelRoad Track
  Road = SandRoad Track
  Road = DirtPath Track
  BridgeSurface = Paved

  ; What has a weight: these kinds, but none of the exempt ones.
  Vehicles = VEHICLE
  Exempt = AIRCRAFT
End
