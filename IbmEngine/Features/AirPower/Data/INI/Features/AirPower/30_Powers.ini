; IBM Engine AirPower pack: general powers instead of jets and super weapon buildings.
;
; New promotions:
;   USA   rank 1  Precision Strike  a B-52 drops one heavy bomb on a spot (tanks, buildings)
;   China rank 3  Napalm Strike     five MiGs napalm a spot (retail's unused power, now for sale)
;   GLA   rank 3  Mine Rockets      four rockets come down on an area and scatter mines
; Super weapons are no longer built. At rank 5 every player gets its side's strike, ordered from the
; Command Center: USA Cruise Missile, China Nuclear Missile, GLA Scud Storm. The missiles come down out
; of the sky onto the target (launched from off the map), about 5 seconds after the order.
;
; New powers reuse special power types that their side's Command Center doesn't use (USA carpet
; bomb, China cluster mines), so the power bar finds the right one.

; -----------------------------------------------------------------------------
; Weapons
; -----------------------------------------------------------------------------

; Precision Strike's bomb: a heavy, tight blast.
Weapon IbmPrecisionBombWeapon
  PrimaryDamage = 1000.0
  PrimaryDamageRadius = 25.0
  SecondaryDamage = 250.0
  SecondaryDamageRadius = 60.0
  AttackRange = 50.0
  DamageType = EXPLOSION
  DeathType = EXPLODED
  WeaponSpeed = 999.0
  RadiusDamageAffects = ALLIES ENEMIES NEUTRALS
  DelayBetweenShots = 0
  ClipSize = 0
  ClipReloadTime = 0
End

; -----------------------------------------------------------------------------
; Objects
; -----------------------------------------------------------------------------

; Precision Strike's bomb: the carpet bomb with the heavy blast.
ObjectCopy IbmPrecisionBomb CarpetBomb
  ReplaceModule ModuleTag_05
    Behavior = FireWeaponWhenDeadBehavior IbmAirPowerTag_BombWeapon
      DeathWeapon   = IbmPrecisionBombWeapon
      StartsActive  = Yes
    End
  End
  ReplaceModule ModuleTag_07
    Behavior = SpecialPowerCompletionDie IbmAirPowerTag_BombDone
      SpecialPowerTemplate = IbmSuperweaponPrecisionStrike
    End
  End
End

; Falling warheads: the missiles without their flight control, dropped from high above the target.
; They fall about 5 seconds and blow up (or lay mines) where they land.
ObjectCopy IbmGLAMineRocket ScudStormMissile
  RemoveModule ModuleTag_04   ; flight control
  RemoveModule ModuleTag_07   ; Scud Storm completion
  RemoveModule ModuleTag_08   ; Scud Storm blast
  RemoveModule ModuleTag_09
  ReplaceModule ModuleTag_05
    Behavior = HeightDieUpdate IbmAirPowerTag_Land
      TargetHeight = 5.0
      TargetHeightIncludesStructures = Yes
      SnapToGroundOnDeath = Yes
    End
  End
  AddModule
    Behavior = GenerateMinefieldBehavior IbmAirPowerTag_Mines
      MineName                = ChinaClusterMine
      DistanceAroundObject    = 45
      GenerateOnlyOnDeath     = Yes
      SmartBorder             = Yes
      SmartBorderSkipInterior = No
      AlwaysCircular          = Yes
      GenerationFX            = WeaponFX_ClusterMineImpact
    End
  End
End

ObjectCopy IbmScudWarhead ScudStormMissile
  RemoveModule ModuleTag_04   ; flight control; keeps the Scud Storm's blast and poison
  ReplaceModule ModuleTag_05
    Behavior = HeightDieUpdate IbmAirPowerTag_Land
      TargetHeight = 5.0
      TargetHeightIncludesStructures = Yes
      SnapToGroundOnDeath = Yes
    End
  End
End

ObjectCopy IbmNuclearWarhead NeutronMissile
  RemoveModule ModuleTag_03   ; flight control; keeps the nuclear blast (its slow death)
  ReplaceModule ModuleTag_04
    Behavior = HeightDieUpdate IbmAirPowerTag_Land
      TargetHeight = 5.0
      TargetHeightIncludesStructures = Yes
      SnapToGroundOnDeath = Yes
    End
  End
  AddModule
    Behavior = PhysicsBehavior IbmAirPowerTag_Fall
      Mass = 500.0
    End
  End
End

ObjectCopy IbmCruiseWarhead CruiseMissile
  RemoveModule ModuleTag_03   ; flight control; keeps the MOAB blast
  ReplaceModule ModuleTag_04
    Behavior = HeightDieUpdate IbmAirPowerTag_Land
      TargetHeight = 5.0
      TargetHeightIncludesStructures = Yes
      SnapToGroundOnDeath = Yes
    End
  End
  AddModule
    Behavior = PhysicsBehavior IbmAirPowerTag_Fall
      Mass = 500.0
    End
  End
End

