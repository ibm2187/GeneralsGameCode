; IBM Engine AirPower pack: general powers instead of jets and super weapon buildings.
;
; New promotions:
;   USA   rank 1  Precision Strike  a B-52 drops one heavy bomb on a spot (tanks, buildings)
;   China rank 3  Napalm Strike     five MiGs napalm a spot (retail's unused power, now for sale)
;   GLA   rank 3  Mine Rockets      four rockets from the Command Center scatter mines over an area
; Super weapons are no longer built. At rank 5 every player gets its side's strike, fired from the
; Command Center: USA Cruise Missile, China Nuclear Missile, GLA Scud Storm.
;
; New powers reuse special power types that their side's Command Center doesn't use (USA carpet
; bomb, China cluster mines), so the power bar finds the right one.

; -----------------------------------------------------------------------------
; Weapons
; -----------------------------------------------------------------------------

; Precision Strike's bomb: a heavy, tight blast.
Weapon IbmPrecisionBombWeapon
  PrimaryDamage = 1000.0
  PrimaryDamageRadius = 25.0
  SecondaryDamage = 250.0
  SecondaryDamageRadius = 60.0
  AttackRange = 50.0
  DamageType = EXPLOSION
  DeathType = EXPLODED
  WeaponSpeed = 999.0
  RadiusDamageAffects = ALLIES ENEMIES NEUTRALS
  DelayBetweenShots = 0
  ClipSize = 0
  ClipReloadTime = 0
End

; Mine Rockets: launched from the Command Center like the Scud Storm, landing up to 80 from the spot.
Weapon IbmMineRocketWeapon
  PrimaryDamage = 0
  PrimaryDamageRadius = 0
  AttackRange = 999999
  DamageType = EXPLOSION
  DeathType = EXPLODED
  WeaponSpeed = 99999
  ProjectileObject = IbmGLAMineRocket
  ProjectileExhaust = ScudMissileExhaust
  FireFX = WeaponFX_ScudStormMissile
  FireSound = ScudStormLaunch
  RadiusDamageAffects = ALLIES ENEMIES NEUTRALS
  DelayBetweenShots = 0
  ClipSize = 1
  ClipReloadTime = 0
  ScatterRadius = 80
  AcceptableAimDelta = 180
  ProjectileCollidesWith = STRUCTURES
End

; The Scud Storm strike: the Scud Storm's missile from the Command Center, landing up to 120 from the spot.
Weapon IbmScudStormStrikeWeapon
  PrimaryDamage = 0
  PrimaryDamageRadius = 0
  AttackRange = 999999
  DamageType = EXPLOSION
  DeathType = EXPLODED
  WeaponSpeed = 99999
  ProjectileObject = ScudStormMissile
  ProjectileExhaust = ScudMissileExhaust
  FireFX = WeaponFX_ScudStormMissile
  FireSound = ScudStormLaunch
  ProjectileDetonationFX = ScudStormMissileDetonation
  RadiusDamageAffects = ALLIES ENEMIES NEUTRALS
  DelayBetweenShots = 0
  ClipSize = 1
  ClipReloadTime = 0
  ScatterRadius = 120
  AcceptableAimDelta = 180
  ProjectileCollidesWith = STRUCTURES
End

; -----------------------------------------------------------------------------
; Objects
; -----------------------------------------------------------------------------

; Precision Strike's bomb: the carpet bomb with the heavy blast.
ObjectCopy IbmPrecisionBomb CarpetBomb
  ReplaceModule ModuleTag_05
    Behavior = FireWeaponWhenDeadBehavior IbmAirPowerTag_BombWeapon
      DeathWeapon   = IbmPrecisionBombWeapon
      StartsActive  = Yes
    End
  End
  ReplaceModule ModuleTag_07
    Behavior = SpecialPowerCompletionDie IbmAirPowerTag_BombDone
      SpecialPowerTemplate = IbmSuperweaponPrecisionStrike
    End
  End
End

; Mine Rockets' rocket: the Scud Storm missile, which lays a minefield where it lands instead of
; blowing up.
ObjectCopy IbmGLAMineRocket ScudStormMissile
  RemoveModule ModuleTag_07
  RemoveModule ModuleTag_08
  RemoveModule ModuleTag_09
  AddModule
    Behavior = GenerateMinefieldBehavior IbmAirPowerTag_Mines
      MineName                = ChinaClusterMine
      DistanceAroundObject    = 45
      GenerateOnlyOnDeath     = Yes
      SmartBorder             = Yes
      SmartBorderSkipInterior = No
      AlwaysCircular          = Yes
      GenerationFX            = WeaponFX_ClusterMineImpact
    End
  End
End

