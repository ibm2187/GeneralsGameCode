Object AmericaAirfield
  AddModule
    Behavior = OCLSpecialPower IbmWatchZonesTag_AirPower
      SpecialPowerTemplate = IbmWatchRaptorPatrol
      OCL                  = IbmOCL_WatchRaptorPatrol
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
  AddModule
    Behavior = OCLSpecialPower IbmWatchZonesTag_GroundPower
      SpecialPowerTemplate = IbmWatchA10Watch
      OCL                  = IbmOCL_WatchA10Watch
      CreateLocation       = CREATE_AT_LOCATION
    End
  End
End

