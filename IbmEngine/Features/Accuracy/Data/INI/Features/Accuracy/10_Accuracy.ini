; IBM Engine Accuracy pack. With the Accuracy flag on, direct fire at a unit or a spot on the ground rolls to hit:
;   hit chance = base accuracy x veterancy x range x movement x cover, kept between MinChance and MaxChance.
; A miss lands on the ground beside the target or spot: bullets hurt nobody there, rockets and shells still
; explode there. Buildings are never missed. Weapons not listed by kind below never miss (flame,
; poison, lasers, artillery, bombs).

IbmAccuracy
  ; Base accuracy by kind of weapon (the weapon's DamageType)
  Rifle = 75%               ; SMALL_ARMS
  MachineGun = 60%          ; GATTLING, COMANCHE_VULCAN, and the machine guns listed below
  Sniper = 95%              ; SNIPER, KILLPILOT
  TankGun = 85%             ; ARMOR_PIERCING
  Rocket = 85%              ; INFANTRY_MISSILE, JET_MISSILES, STEALTHJET_MISSILES, small EXPLOSION missiles
  RocketMaxRadius = 10      ; EXPLOSION projectiles with a bigger blast are artillery and never miss

  ; Weapons that don't fit their kind (100% = never misses)
  Weapon = ColonelBurtonSniperRifleWeapon 95%   ; a sniper rifle with SMALL_ARMS damage
  Weapon = AvengerAirLaserOne 100%               ; lasers
  Weapon = AvengerAirLaserTwo 100%
  Weapon = A10ThunderboltVulcan 60%              ; machine guns with SMALL_ARMS damage
  Weapon = BattleDroneMachineGun 60%
  Weapon = CrusaderMachineGun 60%
  Weapon = GattlingBuildingGunAir 60%
  Weapon = GattlingTankGunAir 60%
  Weapon = Infa_MiniGunnerGunAir 60%
  Weapon = PTBoatGun 60%
  Weapon = QuadCannonGun 60%
  Weapon = QuadCannonGunAir 60%
  Weapon = QuadCannonGunUpgradeOne 60%
  Weapon = QuadCannonGunUpgradeOneAir 60%
  Weapon = QuadCannonGunUpgradeTwo 60%
  Weapon = QuadCannonGunUpgradeTwoAir 60%
  Weapon = TunnelNetworkGun 60%
  Weapon = WatchTowerMachineGun 60%

  ; Veterancy multiplies the base: a 75% rifleman hits 86% as Veteran, 95% (the cap) as Elite and Heroic
  Veteran = 115%
  Elite = 130%
  Heroic = 145%
  MinChance = 5%
  MaxChance = 95%

  ; Range: full accuracy up to half the weapon's range, then down to 75% of it at full range
  RangeFalloffStart = 50%
  LongRange = 75%

  ; Movement: a shooter or target moving faster than MovingSpeed (world units per frame; infantry
  ; walk at about 0.7) is harder to hit with. A soldier riding in a vehicle moves with it.
  ShooterMoving = 80%
  TargetMoving = 85%
  MovingSpeed = 0.5

  ; Cover: infantry within CoverRadius of a building or bush are harder to hit
  Cover = 70%
  CoverRadius = 25

  ; How far beyond the target's edge a miss lands, at most
  MissDistance = 15

  ; Played where a missed bullet hits the ground (None = nothing). Missed rockets and shells
  ; explode there with their own effects, and every miss's tracer flies there.
  BulletMissFX = FX_IbmAccuracyBulletMiss
End

; A small puff of dirt where a missed bullet lands
FXList FX_IbmAccuracyBulletMiss
  ParticleSystem
    Name = IbmAccuracyBulletMissDust
  End
End

