; IBM Engine Squads pack: USA squads. Small, elite squads that fit in a Humvee (5 seats).
;
; Members are copies of the retail soldiers that follow an invisible squad leader. Leaders are
; copies of the GLA Angry Mob's leader, which already does this, including its movement
; (AngryMobNexusLocomotor, a little slower than the soldiers so they keep up).

; =============================================================================================
; Members
; =============================================================================================

ObjectCopy IbmUSASquadRanger AmericaInfantryRanger
  KindOf = +IGNORED_IN_GUI          ; selecting a member selects its squad
  RemoveModule ModuleTag_05         ; AutoFindHealingUpdate would walk members away from the squad
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
  End
End

ObjectCopy IbmUSASquadMissileDefender AmericaInfantryMissileDefender
  KindOf = +IGNORED_IN_GUI
  RemoveModule ModuleTag_05         ; AutoFindHealingUpdate
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
  End
End

ObjectCopy IbmUSASquadAntiAirDefender AmericaInfantryMissileDefender
  KindOf = +IGNORED_IN_GUI
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmUSAAntiAirMissileWeapon
  End
  RemoveModule ModuleTag_05         ; AutoFindHealingUpdate
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
  End
End

; --- SEAL Team members: stealthed while they hold still ---------------------------------------

; Colonel Burton's skills: knife, timed and remote C4, sniper rifle, cliff climbing, stealth.
ObjectCopy IbmUSASealDemolitions AmericaInfantryColonelBurton
  KindOf = +IGNORED_IN_GUI
  RemoveModule ModuleTag_05         ; AutoFindHealingUpdate
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
  End
End

ObjectCopy IbmUSASealRifleman AmericaInfantryRanger
  KindOf = +IGNORED_IN_GUI
  RemoveModule ModuleTag_05         ; AutoFindHealingUpdate
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
    Behavior = StealthUpdate IbmSquadTag_Stealth
      StealthDelay = 2000
      StealthForbiddenConditions = FIRING_PRIMARY
      HintDetectableConditions = IS_FIRING_WEAPON
      FriendlyOpacityMin = 50.0%
      FriendlyOpacityMax = 100.0%
      InnateStealth = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
End

ObjectCopy IbmUSASealMissileSpecialist AmericaInfantryMissileDefender
  KindOf = +IGNORED_IN_GUI
  RemoveModule ModuleTag_05         ; AutoFindHealingUpdate
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
    Behavior = StealthUpdate IbmSquadTag_Stealth
      StealthDelay = 2000
      StealthForbiddenConditions = FIRING_PRIMARY
      HintDetectableConditions = IS_FIRING_WEAPON
      FriendlyOpacityMin = 50.0%
      FriendlyOpacityMax = 100.0%
      InnateStealth = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
End

; =============================================================================================
; Squads
; =============================================================================================

; Anti-infantry: 4 Rangers. 4 x 225 = 900, minus 10%.
ObjectCopy IbmUSARangerSquad GLAInfantryAngryMobNexus
  SelectPortrait = SARanger_L
  ButtonImage = SARanger
  UpgradeCameo1 = Upgrade_AmericaRangerFlashBangGrenade
  UpgradeCameo2 = Upgrade_AmericaAdvancedTraining
  UpgradeCameo3 = Upgrade_InfantryCaptureBuilding
  UpgradeCameo4 = Upgrade_AmericaChemicalSuits
  DisplayName = OBJECT:IbmUSARangerSquad
  Side = America
  RadarPriority = NOT_ON_RADAR      ; the members show on radar
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmSquadTargetGroundWeapon
  End
  BuildCost = 810
  BuildTime = 12.0
  Prerequisites
    Object = AmericaBarracks
  End
  CommandSet = IbmSquadCommandSet
  VoiceSelect = RangerVoiceSelect
  VoiceMove = RangerVoiceMove
  VoiceGuard = RangerVoiceMove
  VoiceAttack = RangerVoiceAttack
  SoundAmbient = NoSound
  UnitSpecificSounds
    VoiceCreate = RangerVoiceCreate
  End
  ReplaceModule ModuleTag_05
    Behavior = SpawnBehavior IbmSquadTag_Spawn
      SpawnNumber = 4
      SpawnTemplateName = IbmUSASquadRanger
      InitialBurst = 4
      OneShot = Yes                 ; lost members are not replaced for free
      ExitByBudding = Yes
      AggregateHealth = Yes
      SlavesHaveFreeWill = No
    End
  End
End

