; IBM Engine Squads pack: button sets.
; Retail sets are overrides: only the slots listed here change, the rest stay retail.
; Slots 1 and 2 replace the basic infantry; the others were empty in retail.

; The squad itself (same buttons as the Angry Mob).
CommandSet IbmSquadCommandSet
  11 = Command_AttackMove
  13 = Command_Guard
  14 = Command_Stop
End

; Commando squads add their hero's skills in the hero's own slots. The buttons are evaluated for,
; and their orders go to, the member who has the skill.
CommandSet IbmUSASealTeamCommandSet
   1 = Command_ColonelBurtonKnifeAttack
   2 = Command_ColonelBurtonTimedDemoCharge
   4 = Command_ColonelBurtonRemoteDemoCharge
   6 = Command_ColonelBurtonDetonateCharges
  11 = Command_AttackMove
  13 = Command_Guard
  14 = Command_Stop
End

CommandSet IbmChinaInfiltratorsCommandSet
   1 = Command_ChinaInfantryBlackLotusCaptureHack
   3 = Command_ChinaInfantryBlackLotusVehicleHack
   5 = Command_ChinaInfantryBlackLotusCashHack
  11 = Command_AttackMove
  13 = Command_Guard
  14 = Command_Stop
End

CommandSet IbmGLASuicideSquadCommandSet
   1 = Command_GLAInfantryJarmenKellSnipeVehicleAttack
   2 = Command_IbmSquadBomberDetonate
  11 = Command_AttackMove
  13 = Command_Guard
  14 = Command_Stop
End

; Never shown (members are hidden from the GUI); it marks who can Detonate.
CommandSet IbmGLABomberCommandSet
   1 = Command_IbmSquadBomberDetonate
End

CommandSet AmericaBarracksCommandSet
  1 = Command_IbmConstructUSARangerSquad
  2 = Command_IbmConstructUSAMissileSquad
  5 = Command_IbmConstructUSAAntiAirSquad
  9 = Command_IbmConstructUSASealTeam
End

CommandSet ChinaBarracksCommandSet
  1 = Command_IbmConstructChinaRedguardSquad
  2 = Command_IbmConstructChinaTankHunterSquad
  5 = Command_IbmConstructChinaAntiAirSquad
  6 = Command_IbmConstructChinaInfiltrators
End

CommandSet GLABarracksCommandSet
  1 = Command_IbmConstructGLARebelSquad
  2 = Command_IbmConstructGLARPGSquad
  9 = Command_IbmConstructGLAAntiAirSquad
 10 = Command_IbmConstructGLASuicideSquad
End
