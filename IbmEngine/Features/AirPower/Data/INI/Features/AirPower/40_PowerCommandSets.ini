; Power bars. China's Nuclear Missile and GLA's Scud Storm shortcuts already find the Command Center.
; USA: the Particle Cannon's slot fires the Cruise Missile; the Spy Satellite (still on the Command
; Center) makes room for Precision Strike.
CommandSet SpecialPowerShortcutUSA
   6 = SupW_Command_CruiseMissileFromShortcut
   7 = Command_IbmPrecisionStrikeFromShortcut
End

CommandSet AirF_SpecialPowerShortcutUSA
