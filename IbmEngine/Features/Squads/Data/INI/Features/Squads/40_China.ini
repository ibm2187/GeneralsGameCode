; IBM Engine Squads pack: China squads. Big squads, strength in numbers; they fit in a Troop
; Crawler (8 seats). Same pattern as 30_USA.ini. A Red Guard costs 150 (the retail button buys
; two for 300). Red Guards and Tank Hunters have no AutoFindHealingUpdate to remove.

; =============================================================================================
; Members
; =============================================================================================

ObjectCopy IbmChinaSquadRedguard ChinaInfantryRedguard
  KindOf = +IGNORED_IN_GUI
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 40
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
    End
  End
End

ObjectCopy IbmChinaSquadTankHunter ChinaInfantryTankHunter
  KindOf = +IGNORED_IN_GUI
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 40
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
    End
  End
End

ObjectCopy IbmChinaSquadAntiAirHunter ChinaInfantryTankHunter
  KindOf = +IGNORED_IN_GUI
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmChinaAntiAirMissileWeapon
  End
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 40
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
    End
  End
End

; --- Infiltrator members: stealthed while they hold still -------------------------------------

; Black Lotus's skills: capture buildings, disable vehicles, steal cash, stealth, spots stealth.
ObjectCopy IbmChinaInfiltratorLead ChinaInfantryBlackLotus
  KindOf = +IGNORED_IN_GUI
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 40
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
    End
  End
End

ObjectCopy IbmChinaInfiltratorGunner ChinaInfantryRedguard
  KindOf = +IGNORED_IN_GUI
  ReplaceModule ModuleTag_DefaultStealthUpdate  ; every infantry has a default one; a second would clash
    Behavior = StealthUpdate IbmSquadTag_Stealth
      StealthDelay = 2000
      StealthForbiddenConditions = FIRING_PRIMARY
      HintDetectableConditions = IS_FIRING_WEAPON
      FriendlyOpacityMin = 50.0%
      FriendlyOpacityMax = 100.0%
      InnateStealth = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 40
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
    End
  End
End

ObjectCopy IbmChinaInfiltratorMissileGunner ChinaInfantryTankHunter
  KindOf = +IGNORED_IN_GUI
  ReplaceModule ModuleTag_DefaultStealthUpdate  ; every infantry has a default one; a second would clash
    Behavior = StealthUpdate IbmSquadTag_Stealth
      StealthDelay = 2000
      StealthForbiddenConditions = FIRING_PRIMARY
      HintDetectableConditions = IS_FIRING_WEAPON
      FriendlyOpacityMin = 50.0%
      FriendlyOpacityMax = 100.0%
      InnateStealth = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 40
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
    End
  End
End

; =============================================================================================
; Squads
; =============================================================================================

; Anti-infantry: 6 Red Guards. 6 x 150 = 900, minus 10%.
ObjectCopy IbmChinaRedguardSquad GLAInfantryAngryMobNexus
  SelectPortrait = SNRedGuard_L
  ButtonImage = SNRedGuard_L
  UpgradeCameo1 = Upgrade_Nationalism
  UpgradeCameo2 = Upgrade_InfantryCaptureBuilding
  UpgradeCameo3 = Upgrade_Nationalism
  UpgradeCameo4 = Upgrade_Nationalism
  DisplayName = OBJECT:IbmChinaRedguardSquad
  Side = China
  RadarPriority = NOT_ON_RADAR
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmSquadTargetGroundWeapon
  End
  BuildCost = 810
  BuildTime = 18.0
  Prerequisites
    Object = ChinaBarracks
  End
  CommandSet = IbmSquadCommandSet
  VoiceSelect = RedGuardVoiceSelect
  VoiceMove = RedGuardVoiceMove
  VoiceGuard = RedGuardVoiceMove
  VoiceAttack = RedGuardVoiceAttack
  SoundAmbient = NoSound
  UnitSpecificSounds
    VoiceCreate = RedGuardVoiceCreate
  End
  ReplaceModule ModuleTag_05
    Behavior = SpawnBehavior IbmSquadTag_Spawn
      SpawnNumber = 6
      SpawnTemplateName = IbmChinaSquadRedguard
      InitialBurst = 6
      OneShot = Yes
      ExitByBudding = Yes
      AggregateHealth = Yes
      SlavesHaveFreeWill = No
    End
  End
  AddModule
    Behavior = IbmSquadUpdate IbmSquadTag_Squad
      AIReplaces = ChinaInfantryRedguard
      ReinforceAt = ChinaBarracks
      ReinforceRadius = 200
    End
  End
End

