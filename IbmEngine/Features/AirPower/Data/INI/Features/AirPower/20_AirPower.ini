; IBM Engine AirPower pack: settings. The skirmish AI's teams that ask for a jet build a helicopter
; instead, in the same general's version when there is one (AirF_AmericaJetRaptor -> AirF_AmericaVehicleComanche).

IbmAirPower
  ; Strikes, bombs and missiles from general powers need a target in sight of one of your units right
  ; now, not just ground you explored before: scout or spot first. Human players only.
  StrikesNeedSight = Yes

  AIReplace = AmericaJetRaptor          AmericaVehicleComanche
  AIReplace = AmericaJetAurora          AmericaVehicleComanche
  AIReplace = AmericaJetStealthFighter  AmericaVehicleComanche
  AIReplace = ChinaJetMIG               ChinaVehicleHelix
End
