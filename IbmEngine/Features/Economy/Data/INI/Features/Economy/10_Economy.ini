; IBM Engine Economy pack. With the Economy flag on, every vehicle and aircraft is worth more and
; lives longer: it costs more, takes longer to build, has more health and hits harder, and moves slower.
; Health goes up more than damage, so fights last longer and a hurt unit has time to pull back.
; Shots hit harder but come much slower: damage x1.25 at 60% rate of fire is 75% of retail damage per second
; against vehicles, while vehicle weapons do x1.5 against infantry (x1.125 of retail per second).
;
; Each line multiplies stats with Stat:Percent tokens. Stats: Cost, BuildTime, Health, Damage, Speed,
; RateOfFire (60% = 60% as many shots: the delay between shots and the reload take 1.67 times as long),
; VsInfantry (the unit's damage against infantry, on top of Damage).
; - VsInfantryByDamage = <DamageType> <percent>  replaces VsInfantry for that unit's weapons of that type.
; - Kind = <KindOf> ...  applies to units a player can build that have that KindOf; the first match wins.
; - Exempt = <KindOf> ... units with any of these get no Kind multipliers (they can still have a Unit line).
; - Unit = <Object> ...  replaces the stats it names for that unit, and for the generals' versions of it
;   ("Tank_ChinaTankOverlord" uses the ChinaTankOverlord line unless it has its own).
; - Reload = <Weapon> <seconds>  the weapon fires once per that many seconds: with no clip it waits that long
;   between shots, with a clip (one shell or a burst) it takes that long to reload. It replaces the unit's
;   RateOfFire for that weapon; veterancy and upgrades still speed it up. Also covers the generals' versions.
; Speed lowers the unit's normal top speed; its speed when badly damaged stays as it was, unless that is faster.

IbmEconomy
  Kind = AIRCRAFT Cost:200% BuildTime:200% Health:150% Damage:125% RateOfFire:60% VsInfantry:150% Speed:85%
  Kind = VEHICLE  Cost:200% BuildTime:200% Health:150% Damage:125% RateOfFire:60% VsInfantry:150% Speed:80%

  ; Tank shells: retail infantry armor takes only 10% from ARMOR_PIERCING, so a vehicle's tank gun gets
  ; x10 against infantry instead of its VsInfantry: a shell kills or badly hurts a soldier, like in
  ; Company of Heroes. Machine guns and the rest keep VsInfantry.
  VsInfantryByDamage = ARMOR_PIERCING 1000%

  ; Dozers, supply trucks, Chinooks and drones keep their retail stats.
  Exempt = DOZER HARVESTER DRONE

  ; Speed per unit: light units keep more of their speed, heavy ones lose more.
  ; Scouts, transports and support vehicles cost less extra than combat units.

  ; USA
  Unit = AmericaVehicleHumvee          Cost:150% BuildTime:150% Speed:90%
  Unit = AmericaVehicleMedic           Cost:150% BuildTime:150% Speed:90%   ; Ambulance
