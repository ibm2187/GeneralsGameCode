; IBM Engine Accuracy pack. With the Accuracy flag on, direct fire rolls to hit:
;   hit chance = base accuracy x veterancy x range x movement x cover, kept between MinChance and MaxChance.
; A miss lands on the ground beside the target: bullets hurt nobody there, rockets and shells still
; explode there. Buildings are never missed. Weapons not listed by kind below never miss (flame,
; poison, lasers, artillery, bombs).

IbmAccuracy
  ; Base accuracy by kind of weapon (the weapon's DamageType)
  Rifle = 65%               ; SMALL_ARMS
  MachineGun = 50%          ; GATTLING, COMANCHE_VULCAN, and the machine guns listed below
  Sniper = 95%              ; SNIPER, KILLPILOT
  TankGun = 75%             ; ARMOR_PIERCING
  Rocket = 80%              ; INFANTRY_MISSILE, JET_MISSILES, STEALTHJET_MISSILES, small EXPLOSION missiles
  RocketMaxRadius = 10      ; EXPLOSION projectiles with a bigger blast are artillery and never miss

  ; Weapons that don't fit their kind (100% = never misses)
  Weapon = ColonelBurtonSniperRifleWeapon 95%   ; a sniper rifle with SMALL_ARMS damage
  Weapon = AvengerAirLaserOne 100%               ; lasers
  Weapon = AvengerAirLaserTwo 100%
  Weapon = A10ThunderboltVulcan 50%              ; machine guns with SMALL_ARMS damage
  Weapon = BattleDroneMachineGun 50%
  Weapon = CrusaderMachineGun 50%
  Weapon = GattlingBuildingGunAir 50%
  Weapon = GattlingTankGunAir 50%
  Weapon = Infa_MiniGunnerGunAir 50%
  Weapon = PTBoatGun 50%
  Weapon = QuadCannonGun 50%
  Weapon = QuadCannonGunAir 50%
  Weapon = QuadCannonGunUpgradeOne 50%
  Weapon = QuadCannonGunUpgradeOneAir 50%
  Weapon = QuadCannonGunUpgradeTwo 50%
  Weapon = QuadCannonGunUpgradeTwoAir 50%
  Weapon = TunnelNetworkGun 50%
  Weapon = WatchTowerMachineGun 50%

  ; Veterancy multiplies the base: a 65% rifleman hits 75% as Veteran, 85% Elite, 94% Heroic
  Veteran = 115%
  Elite = 130%
  Heroic = 145%
  MinChance = 5%
  MaxChance = 95%

  ; Range: full accuracy up to half the weapon's range, then down to 75% of it at full range
  RangeFalloffStart = 50%
  LongRange = 75%

  ; Movement: a shooter or target moving faster than MovingSpeed (world units per frame; infantry
  ; walk at about 0.7) is harder to hit with. A soldier riding in a vehicle moves with it.
  ShooterMoving = 80%
  TargetMoving = 85%
  MovingSpeed = 0.5

  ; Cover: infantry within CoverRadius of a building or bush are harder to hit
  Cover = 70%
  CoverRadius = 25

  ; How far beyond the target's edge a miss lands, at most
  MissDistance = 15
End
