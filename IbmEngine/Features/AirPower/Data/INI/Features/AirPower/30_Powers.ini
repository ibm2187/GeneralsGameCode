; -----------------------------------------------------------------------------
; Command Centers. Every version gets its side's rank-5 strike; the base sides also get the new
; promotion's power (the generals' promotion screens don't offer it yet).
; -----------------------------------------------------------------------------

Object AmericaCommandCenter
  AddModule
    Behavior = OCLSpecialPower IbmAirPowerTag_PrecisionStrike
      SpecialPowerTemplate = IbmSuperweaponPrecisionStrike
      OCL                  = IbmSUPERWEAPON_PrecisionStrike
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
