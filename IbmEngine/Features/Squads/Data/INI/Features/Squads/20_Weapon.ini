  PrimaryDamage = 55.0
  PrimaryDamageRadius = 5.0
  AttackRange = 225.0
  DamageType = INFANTRY_MISSILE
  DeathType = NORMAL
  WeaponSpeed = 600
  ProjectileObject = MissileDefenderMissile
