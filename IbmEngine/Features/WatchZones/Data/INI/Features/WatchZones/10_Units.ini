; IBM Engine WatchZones pack: the jets the zones call in, their weapons, and GLA's nest and traps.
; Weapons come first: objects look them up by name as they load.

; -----------------------------------------------------------------------------
; Weapons. Fired by the engine at the enemy the jet follows, so the missiles home in on it.
; -----------------------------------------------------------------------------

; Raptor Patrol: two air-to-air missiles per pass.
Weapon IbmRaptorPatrolMissileWeapon
  PrimaryDamage               = 100.0
  PrimaryDamageRadius         = 5.0
  AttackRange                 = 999999
  DamageType                  = JET_MISSILES
  DeathType                   = EXPLODED
  WeaponSpeed                 = 1000
  ProjectileObject            = RaptorJetMissile
  ProjectileExhaust           = MissileExhaust
  FireSound                   = RaptorJetMissileWeapon
  ProjectileDetonationFX      = WeaponFX_JetMissileDetonation
  RadiusDamageAffects         = ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots           = 0
  ClipSize                    = 0
  ClipReloadTime              = 0
  AcceptableAimDelta          = 180
  AntiAirborneVehicle         = Yes
  AntiGround                  = Yes
End

; MiG Patrol: two missiles per MiG; MiGs come in pairs.
Weapon IbmMiGPatrolMissileWeapon
  PrimaryDamage               = 75.0
  PrimaryDamageRadius         = 5.0
  AttackRange                 = 999999
  DamageType                  = JET_MISSILES
  DeathType                   = EXPLODED
  WeaponSpeed                 = 1000
  ProjectileObject            = NapalmMissile
  ProjectileExhaust           = MissileExhaust
  FireSound                   = MigJetNapalmWeapon
  ProjectileDetonationFX      = WeaponFX_JetMissileDetonation
  RadiusDamageAffects         = ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots           = 0
  ClipSize                    = 0
  ClipReloadTime              = 0
  AcceptableAimDelta          = 180
  AntiAirborneVehicle         = Yes
  AntiGround                  = Yes
End

; MiG Hunter: two armour-piercing missiles per MiG that leave Black Napalm burning where they hit.
; MiGs come in pairs.
Weapon IbmMiGHunterMissileWeapon
  PrimaryDamage               = 200.0
  PrimaryDamageRadius         = 5.0
  SecondaryDamage             = 50.0
  SecondaryDamageRadius       = 30.0
  AttackRange                 = 999999
  DamageType                  = JET_MISSILES
  DeathType                   = BURNED
  WeaponSpeed                 = 1000
  ProjectileObject            = NapalmMissile
  ProjectileExhaust           = MissileExhaust
  FireSound                   = MigJetNapalmWeapon
  ProjectileDetonationFX      = WeaponFX_BlackNapalmExplosion
  ProjectileDetonationOCL     = OCL_FireFieldUpgradedSmall
  RadiusDamageAffects         = ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots           = 0
  ClipSize                    = 0
  ClipReloadTime              = 0
  AcceptableAimDelta          = 180
  AntiGround                  = Yes
End

; Trap Field: a trap's blast. Hits enemies only, so traps don't set each other off.
Weapon IbmTrapFieldBlastWeapon
  PrimaryDamage               = 300.0
  PrimaryDamageRadius         = 25.0
  SecondaryDamage             = 150.0
  SecondaryDamageRadius       = 50.0
  AttackRange                 = 50.0
  DamageType                  = EXPLOSION
  DeathType                   = EXPLODED
  WeaponSpeed                 = 99999
  FireFX                      = WeaponFX_DemoTrapDetonation
  PlayFXWhenStealthed         = Yes
  RadiusDamageAffects         = ENEMIES NEUTRALS
  DelayBetweenShots           = 0
  ClipSize                    = 0
  AntiGround                  = Yes
End

; -----------------------------------------------------------------------------
; Jets. Each flies one pass (DeliverPayload): it fires once per payload item, then leaves the map.
; The A-10 Watch uses the retail A-10 strike jet as it is.
; -----------------------------------------------------------------------------

ObjectCopy IbmRaptorPatrolJet AmericaJetRaptor
  KindOf = -SELECTABLE +IGNORED_IN_GUI +EMP_HARDENED
  RemoveModule ModuleTag_09   ; JetAIUpdate: no airfield to return to (ReplaceModule needs the same type)
  AddModule
    Behavior = DeliverPayloadAIUpdate IbmWatchZonesTag_Deliver
      DoorDelay = 0
    End
  End
  Locomotor = SET_NORMAL RaptorJetLocomotor
  RemoveModule ModuleTag_06   ; no pilot ejects
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmRaptorPatrolMissileWeapon
  End
  AddModule
    Behavior = TransportContain IbmWatchZonesTag_Payload
      Slots = 100
      ScatterNearbyOnExit = No
      OrientLikeContainerOnExit = Yes
      KeepContainerVelocityOnExit = Yes
      AllowInsideKindOf = PROJECTILE
      DoorOpenTime = 0
      NumberOfExitPaths = 0
      DestroyRidersWhoAreNotFreeToExit = Yes
    End
  End
End

ObjectCopy IbmMiGPatrolJet ChinaJetMIGNapalmStriker
  RemoveModule ModuleTag_03   ; Napalm Strike's completion
  RemoveModule ModuleTag_07   ; Black Napalm weapons
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmMiGPatrolMissileWeapon
  End
End

ObjectCopy IbmMiGHunterJet ChinaJetMIGNapalmStriker
  RemoveModule ModuleTag_03
  RemoveModule ModuleTag_07
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmMiGHunterMissileWeapon
  End
End

; -----------------------------------------------------------------------------
; GLA. The player can't select or order these; they go away on their own after 60 seconds.
; -----------------------------------------------------------------------------

; Stinger Nest: the nest's soldiers, hidden from the start and firing at aircraft only.
ObjectCopy IbmGLANestStinger GLAInfantryStingerSoldier
  RemoveModule ModuleTag_10   ; StealthUpgrade: hidden from the start
  ReplaceModule ModuleTag_09
    Behavior = StealthUpdate IbmWatchZonesTag_Stealth
      StealthDelay                = 1000
      StealthForbiddenConditions  = ATTACKING USING_ABILITY
      MoveThresholdSpeed          = 3
      InnateStealth               = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
  WeaponSet
    Conditions = None
    Weapon = PRIMARY StingerMissileWeaponAir
  End
End

; Stinger Nest: a camouflaged Stinger Site. Its three soldiers come back 10 seconds after they die,
; as long as the site stands; when the site goes, they go with it. Firing reveals the soldiers, not the
; site.
ObjectCopy IbmGLAStingerNest GLAStingerSite
  KindOf = -SELECTABLE -SCORE_CREATE
  RemoveModule ModuleTag_08   ; RebuildHoleExposeDie: no rebuilding
  RemoveModule ModuleTag_14   ; StealthUpgrade: hidden from the start
  ReplaceModule ModuleTag_06
    Behavior = SpawnBehavior IbmWatchZonesTag_Spawn
      SpawnNumber           = 3
      SpawnReplaceDelay     = 10000
      SpawnTemplateName     = IbmGLANestStinger
      CanReclaimOrphans     = No
      SpawnedRequireSpawner = Yes
      SlavesHaveFreeWill    = No
    End
  End
  ReplaceModule ModuleTag_13
    Behavior = StealthUpdate IbmWatchZonesTag_Stealth
      StealthDelay                = 1000
      StealthForbiddenConditions  = ATTACKING USING_ABILITY TAKING_DAMAGE
      MoveThresholdSpeed          = 3
      InnateStealth               = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
  AddModule
    Behavior = LifetimeUpdate IbmWatchZonesTag_Lifetime
      MinLifetime = 60000
      MaxLifetime = 60000
    End
  End
End

; Trap Field: a hidden demo trap that blows up when an enemy vehicle comes within 40. Infantry and
; aircraft don't set it off. Shooting it once it is found sets it off too. Unused traps vanish.
ObjectCopy IbmGLAFieldTrap GLADemoTrap
  KindOf = -SELECTABLE
  ReplaceModule ModuleTag_04
    Behavior = DemoTrapUpdate IbmWatchZonesTag_Trap
      DefaultProximityMode      = Yes
      DetonationWeaponSlot      = PRIMARY
      ProximityModeWeaponSlot   = SECONDARY
      ManualModeWeaponSlot      = TERTIARY
      TriggerDetonationRange    = 40.0
      IgnoreTargetTypes         = PROJECTILE UNATTACKABLE INFANTRY AIRCRAFT
      AutoDetonationWithFriendsInvolved = Yes
      DetonateWhenKilled        = Yes
    End
  End
  ReplaceModule ModuleTag_05
    Behavior = SlowDeathBehavior IbmWatchZonesTag_Blast
      ExemptStatus     = UNDER_CONSTRUCTION
      DestructionDelay = 300
      FX               = INITIAL FX_GLADemoTrapWarning
      Weapon           = FINAL IbmTrapFieldBlastWeapon
    End
  End
  AddModule
    Behavior = DeletionUpdate IbmWatchZonesTag_Gone
      MinLifetime = 60000
      MaxLifetime = 60000
    End
  End
End
