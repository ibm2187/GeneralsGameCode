; CoH FireRate pack. With the FireRate flag on, a weapon that fires faster than its class allows is
; slowed to that limit, and each of its shots does more damage by the same factor: damage per second
; stays the same, but a fight turns on fewer, bigger shots, so each one (and each Accuracy roll)
; matters. The rate is averaged over a clip and its reload; a clip's shots and its reload stretch
; alike, so a burst stays a burst. A gattling's rate is counted fully spun up. Veterancy and upgrade
; bonuses still apply on top.
; Weapons whose damage type has no Class line are never slowed (snipers, jets, flame, lasers), nor
; are area weapons, artillery that scatters, or weapons that go off where the shooter stands.

CoHFireRate
  ; At most one shot every this many seconds, by the weapon's DamageType
  Class = SMALL_ARMS 2              ; rifles: Ranger and Rebel x6.7 (33 damage a shot), Red Guard x2 (30)
  Class = GATTLING 1                ; machine guns, counted fully spun up (x3): Gattling tank x7.5, Minigunner x6
  Class = COMANCHE_VULCAN 1         ; Humvee gun x5, Comanche and Helix guns x8
  Class = ARMOR_PIERCING 5          ; tank guns: Crusader and Battlemaster x2.5 (150), Scorpion x5, Overlord x4.4
  Class = INFANTRY_MISSILE 3        ; Tank Hunter and Missile Defender x3 (120)
  Class = EXPLOSION 3               ; rockets and missiles with a small blast: Patriot x4.4, RPG Technical x3

  ; Weapons that don't fit their class: one weapon's own limit. 0 never slows it. A Weapon line
  ; applies even to an area weapon.
  Weapon = A10ThunderboltVulcan 1           ; heavy machine guns with SMALL_ARMS damage
  Weapon = BattleDroneMachineGun 1
  Weapon = GattlingBuildingGunAir 1
  Weapon = GattlingTankGunAir 1
  Weapon = Infa_MiniGunnerGunAir 1
  Weapon = PTBoatGun 1
  Weapon = QuadCannonGun 1
  Weapon = QuadCannonGunAir 1
  Weapon = QuadCannonGunUpgradeOne 1
  Weapon = QuadCannonGunUpgradeOneAir 1
  Weapon = QuadCannonGunUpgradeTwo 1
  Weapon = QuadCannonGunUpgradeTwoAir 1
  Weapon = TunnelNetworkGun 1
  Weapon = WatchTowerMachineGun 1
  Weapon = MissileDefenderLaserGuidedMissileWeapon 3   ; a missile with ARMOR_PIERCING damage
  Weapon = ColonelBurtonSniperRifleWeapon 0            ; a sniper rifle with SMALL_ARMS damage
  Weapon = AvengerAirLaserOne 0                        ; point-defence lasers
  Weapon = AvengerAirLaserTwo 0

  ; A weapon with a blast bigger than this is an area weapon and isn't slowed by its class
  MaxDamageRadius = 8

  ; A weapon is slowed at most this many times, so its shots don't grow far past what kills a target
  MaxSlowDown = 8

  ; The share of its damage per second a slowed weapon keeps: 100% makes each shot exactly as much
  ; bigger as the weapon is slower
  DamagePerSecond = 100%
End
