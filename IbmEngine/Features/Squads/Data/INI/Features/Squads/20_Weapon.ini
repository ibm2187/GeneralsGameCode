  FireSound = MissileDefenderWeapon
  RadiusDamageAffects = ENEMIES NEUTRALS
  DelayBetweenShots = 900
  ClipSize = 0
  ClipReloadTime = 0
  AntiGround = No
  AntiAirborneVehicle = Yes
  AntiAirborneInfantry = Yes
End

