; The launchers: the Artillery Barrage's invisible cannon, appearing beyond the map edge farthest from
; the target and firing its weapon once per payload item (DeliverPayload's FireWeapon) as soon as it
; appears, then vanishing.
ObjectCopy IbmScudStrikeLauncher ChinaArtilleryCannon
  RadarPriority = NOT_ON_RADAR
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmScudStrikeWeapon
  End
  AddModule
    Behavior = TransportContain IbmAirPowerTag_Payload
      Slots = 100
      ScatterNearbyOnExit = No
      OrientLikeContainerOnExit = Yes
      KeepContainerVelocityOnExit = Yes
      AllowInsideKindOf = PROJECTILE
      DoorOpenTime = 0
      NumberOfExitPaths = 0
      DestroyRidersWhoAreNotFreeToExit = Yes
    End
  End
End

