; CoH Accuracy pack. With the Accuracy flag on, every shot of a direct-fire weapon at an object rolls:
;   hit chance = weapon's accuracy at that range x target size x shooter moving x target moving x
;   veterancy (x other slices' modifiers), kept between MinChance and MaxChance (MaxChanceBuilding
;   against buildings).
; A miss lands on the ground near the target: bullets hurt nobody there, rockets and shells go off
; there with their blast. Weapons whose damage type has no Class line never roll (flame, poison,
; lasers, melee, hacking), nor do area weapons, artillery that scatters, or weapons that go off
; where the shooter stands.

CoHAccuracy
  ; The weapon's accuracy by its DamageType: at point-blank, at half its range and at its full range
  ; (in between it changes in a straight line). One value is the same at every range. Over 100% is
  ; allowed: the target size multiplier still takes its share.
  Class = SMALL_ARMS 85% 70% 50%          ; rifles and light machine guns
  Class = GATTLING 75% 55% 35%            ; spray: falls off fast with range
  Class = COMANCHE_VULCAN 75% 55% 35%
  Class = SNIPER 150% 150% 140%           ; hits even infantry nearly every time
  Class = KILL_PILOT 120% 110% 100%
  Class = ARMOR_PIERCING 95% 85% 70%      ; tank guns: good against vehicles, poor against infantry by size
  Class = INFANTRY_MISSILE 90% 80% 60%
  Class = EXPLOSION 90% 75% 55%           ; rockets, RPGs, missiles and shells with a small blast
  Class = JET_MISSILES 100% 90% 80%
  Class = STEALTHJET_MISSILES 100% 90% 80%

  ; A weapon with a blast bigger than this is an area weapon and doesn't roll
  MaxDamageRadius = 8

  ; Weapons that don't fit their class
  Weapon = ColonelBurtonSniperRifleWeapon 150% 150% 140%   ; a sniper rifle with SMALL_ARMS damage
  Weapon = A10ThunderboltVulcan 75% 55% 35%                ; heavy machine guns with SMALL_ARMS damage
  Weapon = BattleDroneMachineGun 75% 55% 35%
  Weapon = CrusaderMachineGun 75% 55% 35%
  Weapon = GattlingBuildingGunAir 75% 55% 35%
  Weapon = GattlingTankGunAir 75% 55% 35%
  Weapon = Infa_MiniGunnerGunAir 75% 55% 35%
  Weapon = PTBoatGun 75% 55% 35%
  Weapon = QuadCannonGun 75% 55% 35%
  Weapon = QuadCannonGunAir 75% 55% 35%
  Weapon = QuadCannonGunUpgradeOne 75% 55% 35%
  Weapon = QuadCannonGunUpgradeOneAir 75% 55% 35%
  Weapon = QuadCannonGunUpgradeTwo 75% 55% 35%
  Weapon = QuadCannonGunUpgradeTwoAir 75% 55% 35%
  Weapon = TunnelNetworkGun 75% 55% 35%
  Weapon = WatchTowerMachineGun 75% 55% 35%
  NeverMisses = AvengerAirLaserOne AvengerAirLaserTwo   ; point-defence lasers

  MinChance = 5%
  MaxChance = 90%           ; against units
  MaxChanceBuilding = 95%   ; buildings are the easiest targets, but never certain

  ; Target size: the bigger the target, the easier to hit. By the target's bounding radius; between
  ; points the multiplier changes in a straight line. Infantry are about 7 to 10, light vehicles 15
  ; to 20, an Overlord 29, buildings 40 and more.
  SizePoint = 7 60%
  SizePoint = 10 70%
  SizePoint = 16 90%
  SizePoint = 20 100%
  SizePoint = 30 115%
  SizePoint = 45 140%
  BuildingSizeMin = 180%    ; any building, even a small Gattling cannon: a far rifle shot still hits 90%

  ; Moving faster than MovingSpeed (world units a frame; infantry walk at about 0.7). A soldier
  ; riding in a vehicle moves with it.
  ShooterMoving = 75%
  TargetMoving = 85%
  MovingSpeed = 0.3

  ; Each rank adds this to the multiplier: Veteran x1.15, Elite x1.30, Heroic x1.45
  VeterancyPerRank = 15%

  ; A miss lands this far beyond the target's edge
  MissDistanceMin = 4
  MissDistanceMax = 15

  ; Played where a missed bullet lands (missed rockets and shells show their own explosion)
  MissFX = FX_CoHAccuracyMiss
End

; A small puff of dirt where a missed bullet hits the ground
FXList FX_CoHAccuracyMiss
  ParticleSystem
    Name = InfantryMortarDust
  End
End
