; CoH Squads: which infantry is made as squads, and how squads move. See CoH/Features/Squads/README.md.

CoHSquads
  ; Squad = <unit> <size> [<escort unit> <count>]...
  ; Ordering <unit> makes a squad of <size> of it, plus any escorts. A general's version of the unit
  ; ("AirF_AmericaInfantryRanger") is made the same way unless it has its own line. A unit with no
  ; line is made alone: heroes, workers, hijackers, snipers, hackers, saboteurs.
  Squad = AmericaInfantryRanger 4
  Squad = AmericaInfantryMissileDefender 3
  Squad = ChinaInfantryRedguard 6          ; the Barracks makes 2 per order; one order is one squad
  Squad = ChinaInfantryTankHunter 3
  Squad = Infa_ChinaInfantryMiniGunner 3
  Squad = GLAInfantryRebel 5
  Squad = GLAInfantryTunnelDefender 3
  ; A hero with an escort, for example:
  ; Squad = GLAInfantryJarmenKell 1 GLAInfantryRebel 2

  ; A squad costs its members' price, and takes their build time, scaled by these percents
  CostPercent = 90                         ; four Rangers: 4 x 225 x 90% = 810
  TimePercent = 60                         ; four Rangers: 4 x 5 s x 60% = 12 s

  ; Formation: a squad sent somewhere spreads into rows across its heading
  Spacing = 22                             ; between neighbours, in world units
  RowWidth = 3                             ; members in one row; more go in rows behind
End
