; -----------------------------------------------------------------------------
; Watch zones: invisible, untouchable objects. Only their owner sees the circle. They see what is
; inside it.
; -----------------------------------------------------------------------------

Object IbmWatchZoneRaptorPatrol
  EditorSorting       = SYSTEM
  VisionRange         = 200
  ShroudClearingRange = 200
  KindOf              = NO_COLLIDE IMMOBILE UNATTACKABLE INERT
  AddModule
    Body = ImmortalBody IbmWatchZonesTag_Body
      MaxHealth     = 1
      InitialHealth = 1
    End
  End
  AddModule
    Behavior = IbmWatchZoneUpdate IbmWatchZonesTag_Zone
      Radius            = 200
      Duration          = 45000
      TargetKindOf      = AIRCRAFT
      Targets           = AIRBORNE
      Strikes           = 4
      StrikeDelay       = 5000
      StrikeOCL         = IbmOCL_RaptorPatrolPass
      ApproachDistance  = 1000
      FollowRange       = 350
      ZoneDecal
        Texture           = SCCSpySatellite_USA
        Style             = SHADOW_ALPHA_DECAL
        OpacityMin        = 15%
        OpacityMax        = 35%
        OpacityThrobTime  = 1500
        Color             = R:0 G:156 B:255 A:255
        OnlyVisibleToOwningPlayer = Yes
      End
    End
  End
End

