; IBM Engine WatchZones pack: the jets' passes, the watch zones that call them in, and what each
; building power creates. A zone looks at enemies in its circle; for each one it calls in a jet that
; follows that enemy and fires at it. See IbmEngine\Features\WatchZones\WatchZoneUpdate.h.
; Passes come before the zones that name them; zones come before the lists that create them.

; -----------------------------------------------------------------------------
; Passes: one jet each. "Payload" is a count of shots (each item is destroyed as the jet fires).
; -----------------------------------------------------------------------------

ObjectCreationList IbmOCL_RaptorPatrolPass
  DeliverPayload
    Transport               = IbmRaptorPatrolJet
    StartAtPreferredHeight  = Yes
    StartAtMaxSpeed         = Yes
    MaxAttempts             = 1
    DropOffset              = X:0 Y:0 Z:0
    DropDelay               = 300
    Payload                 = NapalmMissile 2
    FireWeapon              = Yes
    DeliveryDistance        = 350
    DeliveryDecalRadius     = 30
    DeliveryDecal
      Texture           = SCCSpySatellite_USA
      Style             = SHADOW_ALPHA_DECAL
      OpacityMin        = 25%
      OpacityMax        = 50%
      OpacityThrobTime  = 500
      Color             = R:0 G:156 B:255 A:255
      OnlyVisibleToOwningPlayer = Yes
    End
  End
End

; The retail A-10 strike's pass: six missiles and a strafing run.
