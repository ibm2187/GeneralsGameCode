; IBM Engine WatchZones pack: the jets the zones call in, their weapons, and GLA's ambushers.
; Weapons come first: objects look them up by name as they load.

; -----------------------------------------------------------------------------
; Weapons. Fired by the engine at the enemy the jet follows, so the missiles home in on it.
; -----------------------------------------------------------------------------

; Raptor Patrol: two air-to-air missiles per pass.
Weapon IbmRaptorPatrolMissileWeapon
  PrimaryDamage               = 100.0
  PrimaryDamageRadius         = 5.0
  AttackRange                 = 999999
  DamageType                  = JET_MISSILES
  DeathType                   = EXPLODED
  WeaponSpeed                 = 1000
  ProjectileObject            = RaptorJetMissile
  ProjectileExhaust           = MissileExhaust
  FireSound                   = RaptorJetMissileWeapon
  ProjectileDetonationFX      = WeaponFX_JetMissileDetonation
  RadiusDamageAffects         = ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots           = 0
  ClipSize                    = 0
  ClipReloadTime              = 0
  AcceptableAimDelta          = 180
  AntiAirborneVehicle         = Yes
  AntiGround                  = Yes
End

; MiG Patrol: the same, with the MiG's missile.
Weapon IbmMiGPatrolMissileWeapon
  PrimaryDamage               = 100.0
  PrimaryDamageRadius         = 5.0
  AttackRange                 = 999999
  DamageType                  = JET_MISSILES
  DeathType                   = EXPLODED
  WeaponSpeed                 = 1000
  ProjectileObject            = NapalmMissile
  ProjectileExhaust           = MissileExhaust
  FireSound                   = MigJetNapalmWeapon
  ProjectileDetonationFX      = WeaponFX_JetMissileDetonation
  RadiusDamageAffects         = ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots           = 0
  ClipSize                    = 0
  ClipReloadTime              = 0
  AcceptableAimDelta          = 180
  AntiAirborneVehicle         = Yes
  AntiGround                  = Yes
End

; MiG Hunter: two armour-piercing missiles per pass (no napalm fire).
Weapon IbmMiGHunterMissileWeapon
  PrimaryDamage               = 150.0
  PrimaryDamageRadius         = 5.0
  AttackRange                 = 999999
  DamageType                  = JET_MISSILES
  DeathType                   = EXPLODED
  WeaponSpeed                 = 1000
  ProjectileObject            = NapalmMissile
  ProjectileExhaust           = MissileExhaust
  FireSound                   = MigJetNapalmWeapon
  ProjectileDetonationFX      = WeaponFX_JetMissileDetonation
  RadiusDamageAffects         = ENEMIES NEUTRALS NOT_SIMILAR
  DelayBetweenShots           = 0
  ClipSize                    = 0
  ClipReloadTime              = 0
  AcceptableAimDelta          = 180
  AntiGround                  = Yes
End

; -----------------------------------------------------------------------------
; Jets. Each flies one pass (DeliverPayload): it fires once per payload item, then leaves the map.
; The A-10 Watch uses the retail A-10 strike jet as it is.
; -----------------------------------------------------------------------------

ObjectCopy IbmRaptorPatrolJet AmericaJetRaptor
  KindOf = -SELECTABLE +IGNORED_IN_GUI +EMP_HARDENED
  RemoveModule ModuleTag_09   ; JetAIUpdate: no airfield to return to (ReplaceModule needs the same type)
  AddModule
    Behavior = DeliverPayloadAIUpdate IbmWatchZonesTag_Deliver
      DoorDelay = 0
    End
  End
  Locomotor = SET_NORMAL RaptorJetLocomotor
  RemoveModule ModuleTag_06   ; no pilot ejects
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmRaptorPatrolMissileWeapon
  End
  AddModule
    Behavior = TransportContain IbmWatchZonesTag_Payload
      Slots = 100
      ScatterNearbyOnExit = No
      OrientLikeContainerOnExit = Yes
      KeepContainerVelocityOnExit = Yes
      AllowInsideKindOf = PROJECTILE
      DoorOpenTime = 0
      NumberOfExitPaths = 0
      DestroyRidersWhoAreNotFreeToExit = Yes
    End
  End
End

ObjectCopy IbmMiGPatrolJet ChinaJetMIGNapalmStriker
  RemoveModule ModuleTag_03   ; Napalm Strike's completion
  RemoveModule ModuleTag_07   ; Black Napalm weapons
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmMiGPatrolMissileWeapon
  End
End

ObjectCopy IbmMiGHunterJet ChinaJetMIGNapalmStriker
  RemoveModule ModuleTag_03
  RemoveModule ModuleTag_07
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmMiGHunterMissileWeapon
  End
End

; -----------------------------------------------------------------------------
; GLA ambushers: hidden soldiers that stay where they appear, shoot what comes in range and vanish
; after 45 seconds. Firing reveals them. The player can't order them.
; -----------------------------------------------------------------------------

; Stinger Ambush: the Stinger Site's soldier, firing at aircraft only.
ObjectCopy IbmGLAAmbushStinger GLAInfantryStingerSoldier
  KindOf = -CLICK_THROUGH +IMMOBILE
  RemoveModule ModuleTag_06   ; SlavedUpdate: no Stinger Site
  RemoveModule ModuleTag_10   ; StealthUpgrade: hidden from the start
  ReplaceModule ModuleTag_09
    Behavior = StealthUpdate IbmWatchZonesTag_Stealth
      StealthDelay                = 2500
      StealthForbiddenConditions  = ATTACKING USING_ABILITY
      MoveThresholdSpeed          = 3
      InnateStealth               = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
  WeaponSet
    Conditions = None
    Weapon = PRIMARY StingerMissileWeaponAir
  End
  AddModule
    Behavior = DeletionUpdate IbmWatchZonesTag_Gone
      MinLifetime = 45000
      MaxLifetime = 45000
    End
  End
End

; RPG Ambush: the Tunnel Network's RPG trooper.
ObjectCopy IbmGLAAmbushRPG GLAInfantryTunnelDefender
  KindOf = -SELECTABLE +IMMOBILE
  ReplaceModule ModuleTag_03   ; attacks while hidden
    Behavior = AIUpdateInterface IbmWatchZonesTag_AI
      AutoAcquireEnemiesWhenIdle = Yes Stealthed
    End
  End
  Locomotor = SET_NORMAL MissileDefenderLocomotor
  AddModule
    Behavior = StealthUpdate IbmWatchZonesTag_Stealth
      StealthDelay                = 2500
      StealthForbiddenConditions  = ATTACKING USING_ABILITY
      MoveThresholdSpeed          = 3
      InnateStealth               = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
  AddModule
    Behavior = DeletionUpdate IbmWatchZonesTag_Gone
      MinLifetime = 45000
      MaxLifetime = 45000
    End
  End
End
