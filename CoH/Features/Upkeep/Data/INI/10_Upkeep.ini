; CoH Upkeep: the tuning. See CoH/Features/Upkeep/README.md for what each setting does.

CoHUpkeep
  ; Population: each unit takes one per BuildCostPerPopulation of its build cost, rounded
  BuildCostPerPopulation = 250        ; Ranger 1, Crusader 4, Overlord 8
  MinUnitPopulation = 1               ; a unit that costs money takes at least this
  UnitKinds = INFANTRY VEHICLE AIRCRAFT ; objects of any of these kinds take population...
  NonUnitKinds = STRUCTURE DRONE DOZER ; ...unless they are any of these (a $1,000 dozer took 4 of a cap of 32)
  NeverRefusedKinds = DOZER HARVESTER ; take population but are made even at the cap, so nobody loses their builders
  ; Population = <object> <population> sets one unit's population instead of its cost, for example:
  ; Population = ChinaVehicleTroopCrawler 2

  ; The cap: CapBase, plus each finished building of a kind below, plus each sector held.
  ; A base with a barracks, two war factories and five sectors has 6 + 8 + 2 + 6 + 10 = 32 (Pacing
  ; README: armies at minute 10 were 50 to 80 before).
  CapBase = 6
  CapPerSector = 2
  CapMax = 60
  CapBuilding = COMMANDCENTER 8
  CapBuilding = FS_BARRACKS 2
  CapBuilding = FS_WARFACTORY 3
  CapBuilding = FS_AIRFIELD 2

  ; Upkeep: from each step's population on, that share of every income is taken
  UpkeepStep = 0 0
  UpkeepStep = 20 10
  UpkeepStep = 35 25
  UpkeepStep = 50 40

  ; Skirmish AI: grows its army only while upkeep stays at or below this share (below 35 population)
  AIMaxUpkeepPercent = 10
End
