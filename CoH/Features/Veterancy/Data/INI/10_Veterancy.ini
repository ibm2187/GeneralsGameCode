; CoH Veterancy: the tuning. See CoH/Features/Veterancy/README.md for what each setting does and why.
;
; The engine's own rank bonuses stay: more health (x1.2, x1.3, x1.5), more damage (x1.1, x1.2, x1.3),
; a heroic's self-repair and any rank weapon sets. What is set here replaces two of them: Accuracy's
; built-in +15% a rank, and the engine's rate of fire for the rank (x1.2, x1.4, x1.6) by Reload.

CoHVeterancy
  ; Dealing damage worth a victim's full health earns this share of its kill value. The kill still
  ; pays the whole value, as in the original game.
  DamageExperience = 50%

  ; A squad's members share one experience pool and rank, and new members join at it (with Squads).
  SquadsShare = Yes

  ; <Class> = <rank> <bonus> <value> ...: what each rank gives every unit of that class.
  ;   Accuracy               hit chance (x, through Accuracy)
  ;   DamageTaken            damage taken after armor (x)
  ;   SuppressionResistance  share of suppression shrugged off (Suppression)
  ;   Speed, Sight           top speed, and how far it sees (x)
  ;   Reload                 rate of fire and reloads (x), in place of the engine's for the rank
  ;   Upgrade                an object upgrade it is given on reaching the rank
  ; A bonus not named stays at no change. A helicopter counts as an aircraft.
  Infantry = VETERAN Accuracy 115% DamageTaken 90% SuppressionResistance 20% Speed 105% Sight 110% Reload 115%
  Infantry = ELITE   Accuracy 130% DamageTaken 80% SuppressionResistance 40% Speed 110% Sight 115% Reload 130%
  Infantry = HEROIC  Accuracy 150% DamageTaken 70% SuppressionResistance 60% Speed 115% Sight 120% Reload 150%

  Vehicle = VETERAN Accuracy 110% DamageTaken 90% Speed 105% Sight 110% Reload 115%
  Vehicle = ELITE   Accuracy 120% DamageTaken 85% Speed 110% Sight 115% Reload 130%
  Vehicle = HEROIC  Accuracy 135% DamageTaken 75% Speed 115% Sight 120% Reload 150%

  Aircraft = VETERAN Accuracy 110% DamageTaken 90% Sight 110% Reload 115%
  Aircraft = ELITE   Accuracy 120% DamageTaken 85% Sight 115% Reload 130%
  Aircraft = HEROIC  Accuracy 135% DamageTaken 75% Sight 120% Reload 150%

  ; Object = <object> <rank> <bonus> <value> ...: a unit's own changes to one rank, over its class.
  ; A general's version (AirF_AmericaVehicleHumvee) takes its plain unit's lines, then its own.
  Object = AmericaVehicleHumvee ELITE Upgrade Upgrade_AmericaBattleDrone
  Object = AmericaVehicleTomahawk ELITE Upgrade Upgrade_AmericaScoutDrone
End
