; CoH Pacing: the tuning. See CoH/Features/Pacing/README.md for what each setting does and why.

CoHPacing
  ; Cost and build time by class, as a share of retail. A helicopter counts as an aircraft.
  InfantryCost = 150%
  InfantryBuildTime = 150%
  VehicleCost = 150%
  VehicleBuildTime = 150%
  AircraftCost = 150%
  AircraftBuildTime = 150%
  StructureCost = 100%
  StructureBuildTime = 100%
  CostStep = 5                        ; prices are rounded to this many dollars
  ExemptKinds = DOZER HARVESTER DRONE ; builders, workers and drones keep retail prices

  ; Object = <object> <cost> <build time> replaces its class for that object, and for the generals'
  ; versions of it (Tank_ChinaTankOverlord uses a ChinaTankOverlord line unless it has its own).

  ; The skirmish AI by difficulty: the share of its income it keeps, and its build times
  AIEasy = 70% 130%
  AIMedium = 85% 115%
  AIHard = 100% 100%

  ; The share the AI keeps of the money its scripts give it: on Hard $10,000, $10,000, $15,000 and
  ; $20,000 as the game goes on, and $2,200 at the start on every difficulty
  AIScriptMoney = 25%
End
