; GLA Tunnel Networks: every slot is taken, so the powers replace the last two exit buttons. A
; tunnel still holds ten; Evacuate lets out the units that have no exit button.
CommandSet GLATunnelNetworkCommandSet
   9 = Command_IbmWatchStingerAmbush
  10 = Command_IbmWatchRPGAmbush
End

