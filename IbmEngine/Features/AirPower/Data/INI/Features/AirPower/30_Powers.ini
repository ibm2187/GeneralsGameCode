ObjectCreationList IbmSUPERWEAPON_PrecisionStrike
  DeliverPayload
    Transport               = AmericaJetB52
    StartAtPreferredHeight  = Yes
    StartAtMaxSpeed         = Yes
    MaxAttempts             = 1
    DropOffset              = X:0 Y:0 Z:-2
    DropVariance            = X:0 Y:0 Z:0
    Payload                 = IbmPrecisionBomb 1
    DeliveryDistance        = 200
    DeliveryDecalRadius     = 40
    DeliveryDecal
      Texture           = SCCA10Strike_USA
      Style             = SHADOW_ALPHA_DECAL
      OpacityMin        = 25%
      OpacityMax        = 50%
      OpacityThrobTime  = 500
      Color             = R:255 G:156 B:0 A:255
      OnlyVisibleToOwningPlayer = Yes
    End
  End
End

; Strikes ordered from the Command Center (CreateLocation = CREATE_AT_LOCATION): warheads appear
