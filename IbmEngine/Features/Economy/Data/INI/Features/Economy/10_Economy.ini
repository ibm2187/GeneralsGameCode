; IBM Engine Economy pack. With the Economy flag on, every vehicle and aircraft is worth more and
; lives longer: it costs more, takes longer to build, has more health and hits harder, and moves slower.
; Health goes up more than damage, so fights last longer and a hurt unit has time to pull back.
;
; Each line multiplies stats with Stat:Percent tokens. Stats: Cost, BuildTime, Health, Damage, Speed.
; - Kind = <KindOf> ...  applies to units a player can build that have that KindOf; the first match wins.
; - Exempt = <KindOf> ... units with any of these get no Kind multipliers (they can still have a Unit line).
; - Unit = <Object> ...  replaces the stats it names for that unit, and for the generals' versions of it
;   ("Tank_ChinaTankOverlord" uses the ChinaTankOverlord line unless it has its own).
; Speed lowers the unit's normal top speed; its speed when badly damaged stays as it was, unless that is faster.

IbmEconomy
  Kind = AIRCRAFT Cost:200% BuildTime:200% Health:150% Damage:125% Speed:85%
  Kind = VEHICLE  Cost:200% BuildTime:200% Health:150% Damage:125% Speed:80%

  ; Dozers, supply trucks, Chinooks and drones keep their retail stats.
  Exempt = DOZER HARVESTER DRONE

  ; Speed per unit: light units keep more of their speed, heavy ones lose more.
  ; Scouts, transports and support vehicles cost less extra than combat units.

  ; USA
  Unit = AmericaVehicleHumvee          Cost:150% BuildTime:150% Speed:90%
  Unit = AmericaVehicleMedic           Cost:150% BuildTime:150% Speed:90%   ; Ambulance
  Unit = AmericaTankCrusader           Speed:80%
