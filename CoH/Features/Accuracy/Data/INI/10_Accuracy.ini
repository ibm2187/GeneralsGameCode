; CoH Accuracy pack. With the Accuracy flag on, every shot of a direct-fire weapon at an object rolls:
;   hit chance = base x range x shooter moving x target moving x target size x veterancy (x other
;   slices' modifiers), kept between MinChance and MaxChance.
; A miss lands on the ground near the target: bullets hurt nobody there, rockets and shells go off
; there with their blast. Weapons whose damage type has no Class line never roll (flame, poison,
; lasers, melee, hacking), nor do area weapons, artillery that scatters, or weapons that go off
; where the shooter stands.

CoHAccuracy
  ; Base accuracy by the weapon's DamageType
  Class = SMALL_ARMS 70%          ; rifles and light machine guns
  Class = GATTLING 60%
  Class = COMANCHE_VULCAN 60%
  Class = SNIPER 95%
  Class = KILL_PILOT 90%
  Class = ARMOR_PIERCING 80%      ; tank guns
  Class = INFANTRY_MISSILE 75%
  Class = EXPLOSION 75%           ; rockets, RPGs, missiles and shells with a small blast
  Class = JET_MISSILES 85%
  Class = STEALTHJET_MISSILES 85%

  ; A weapon with a blast bigger than this is an area weapon and doesn't roll
  MaxDamageRadius = 8

  ; Weapons that don't fit their class (100% = never misses)
  Weapon = ColonelBurtonSniperRifleWeapon 95%   ; a sniper rifle with SMALL_ARMS damage
  Weapon = AvengerAirLaserOne 100%               ; point-defence lasers
  Weapon = AvengerAirLaserTwo 100%
  Weapon = A10ThunderboltVulcan 60%              ; heavy machine guns with SMALL_ARMS damage
  Weapon = BattleDroneMachineGun 60%
  Weapon = CrusaderMachineGun 60%
  Weapon = GattlingBuildingGunAir 60%
  Weapon = GattlingTankGunAir 60%
  Weapon = Infa_MiniGunnerGunAir 60%
  Weapon = PTBoatGun 60%
  Weapon = QuadCannonGun 60%
  Weapon = QuadCannonGunAir 60%
  Weapon = QuadCannonGunUpgradeOne 60%
  Weapon = QuadCannonGunUpgradeOneAir 60%
  Weapon = QuadCannonGunUpgradeTwo 60%
  Weapon = QuadCannonGunUpgradeTwoAir 60%
  Weapon = TunnelNetworkGun 60%
  Weapon = WatchTowerMachineGun 60%

  MinChance = 5%
  MaxChance = 95%

  ; Range bands, as a share of the weapon's range: near up to NearRange, far beyond FarRange
  NearRange = 33%
  FarRange = 67%
  Near = 115%
  Mid = 100%
  Far = 85%

  ; Moving faster than MovingSpeed (world units a frame; infantry walk at about 0.7). A soldier
  ; riding in a vehicle moves with it.
  ShooterMoving = 75%
  TargetMoving = 85%
  MovingSpeed = 0.3

  ; How big the target is to hit; buildings are hard to miss (the cap still applies)
  TargetSize = Infantry 90%
  TargetSize = Vehicle 100%
  TargetSize = Aircraft 90%
  TargetSize = Building 150%

  ; Each rank adds this to the multiplier: Veteran x1.15, Elite x1.30, Heroic x1.45
  VeterancyPerRank = 15%

  ; A miss lands this far beyond the target's edge
  MissDistanceMin = 4
  MissDistanceMax = 15

  ; Played where a missed bullet lands (missed rockets and shells show their own explosion)
  MissFX = FX_CoHAccuracyMiss
End

; A small puff of dirt where a missed bullet hits the ground
FXList FX_CoHAccuracyMiss
  ParticleSystem
    Name = InfantryMortarDust
  End
End
