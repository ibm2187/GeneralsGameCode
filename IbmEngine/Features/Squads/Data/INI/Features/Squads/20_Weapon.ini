; IBM Engine Squads pack: weapons.

; ---------------------------------------------------------------------------------------------
; Targeting weapons of the invisible squad leader. They do no real harm; the leader uses them
; to pick targets, and its members attack what it targets (like the Angry Mob's leader).
; The range matches the members' rifles (100) so the squad closes in far enough for everyone.
; ---------------------------------------------------------------------------------------------

; For squads that can only hurt ground targets, so they never chase aircraft.
Weapon IbmSquadTargetGroundWeapon
  PrimaryDamage = 0.001
  PrimaryDamageRadius = 0.0
  AttackRange = 100.0
  DamageType = UNRESISTABLE
  DeathType = NORMAL
  WeaponSpeed = 999999.0
  ProjectileObject = NONE
  FireFX = NONE
  RadiusDamageAffects = ENEMIES
  DelayBetweenShots = 99999
  ClipSize = 0
  ClipReloadTime = 0
  AntiGround = Yes
  AntiAirborneVehicle = No
  AntiAirborneInfantry = No
End

; For squads with a missile specialist, which can also hit aircraft.
Weapon IbmSquadTargetAllWeapon
  PrimaryDamage = 0.001
  PrimaryDamageRadius = 0.0
  AttackRange = 150.0
  DamageType = UNRESISTABLE
  DeathType = NORMAL
  WeaponSpeed = 999999.0
  ProjectileObject = NONE
  FireFX = NONE
  RadiusDamageAffects = ENEMIES
  DelayBetweenShots = 99999
  ClipSize = 0
  ClipReloadTime = 0
  AntiGround = Yes
  AntiAirborneVehicle = Yes
  AntiAirborneInfantry = Yes
End

; ---------------------------------------------------------------------------------------------
; Air-only missiles of the anti-aircraft specialists. Longer range and more damage than the
; regular infantry missiles (40 damage, range 175), but they cannot shoot at ground targets.
; ---------------------------------------------------------------------------------------------

