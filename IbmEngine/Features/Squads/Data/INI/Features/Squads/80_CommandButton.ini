; --- Squad orders --------------------------------------------------------------------------------

; Suicide Squad: all its bombers blow themselves up on the spot, at once. Same as the Demolition
; General's suicide attack (Demo_Command_TertiarySuicide).
CommandButton Command_IbmSquadBomberDetonate
  Command = FIRE_WEAPON
  WeaponSlot = TERTIARY
  MaxShotsToFire = 1
  Options = OK_FOR_MULTI_SELECT
  TextLabel = CONTROLBAR:IbmSquadDetonate
  ButtonImage = SUSuicideAttk
  ButtonBorderType = ACTION
  DescriptLabel = CONTROLBAR:IbmToolTipSquadDetonate
End
