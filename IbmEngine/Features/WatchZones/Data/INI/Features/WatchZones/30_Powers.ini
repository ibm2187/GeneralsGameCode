; IBM Engine WatchZones pack: the building powers. USA and China airfields watch an area for
; aircraft or vehicles; the GLA Tunnel Network sets an ambush. No promotion is needed: a power is
; ready once its building is up, and recharges on one timer for all of the player's buildings of
; that kind (SharedSyncedTimer). Losing every such building loses the power.
; Powers come first: the buildings' modules and the buttons look them up by name as they load.

; -----------------------------------------------------------------------------
; Special powers
; -----------------------------------------------------------------------------

SpecialPower IbmWatchRaptorPatrol
  Enum                = SPECIAL_IBM_WATCH_AIR
  ReloadTime          = 180000
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  RadiusCursorRadius  = 200
  AcademyClassify     = ACT_SUPERPOWER
End

SpecialPower IbmWatchA10Watch
  Enum                = SPECIAL_IBM_WATCH_GROUND
  ReloadTime          = 240000
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  RadiusCursorRadius  = 175
  AcademyClassify     = ACT_SUPERPOWER
End

SpecialPower IbmWatchMiGPatrol
  Enum                = SPECIAL_IBM_WATCH_AIR
  ReloadTime          = 180000
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  RadiusCursorRadius  = 200
  AcademyClassify     = ACT_SUPERPOWER
End

SpecialPower IbmWatchMiGHunter
  Enum                = SPECIAL_IBM_WATCH_GROUND
  ReloadTime          = 240000
  PublicTimer         = No
  SharedSyncedTimer   = Yes
  RadiusCursorRadius  = 175
  AcademyClassify     = ACT_SUPERPOWER
End

SpecialPower IbmWatchStingerAmbush
  Enum                    = SPECIAL_IBM_WATCH_AIR
  ReloadTime              = 180000
  PublicTimer             = No
  SharedSyncedTimer       = Yes
  InitiateAtLocationSound = RebelAmbushActivated
  RadiusCursorRadius      = 120
  AcademyClassify         = ACT_SUPERPOWER
End

SpecialPower IbmWatchRPGAmbush
  Enum                    = SPECIAL_IBM_WATCH_GROUND
  ReloadTime              = 180000
  PublicTimer             = No
  SharedSyncedTimer       = Yes
  InitiateAtLocationSound = RebelAmbushActivated
  RadiusCursorRadius      = 120
  AcademyClassify         = ACT_SUPERPOWER
End

