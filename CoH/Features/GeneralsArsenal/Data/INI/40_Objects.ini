  End
  Behavior = DeliverPayloadAIUpdate ModuleTag_CoHAI
  End
  Behavior = SortieLossDie ModuleTag_CoHLoss
    SpecialPower = CoHTank_MiGStrike
  End
  End
  Locomotor = SET_NORMAL MIGLocomotor
End

