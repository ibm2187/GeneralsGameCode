; IBM Engine Squads pack: GLA squads. Cheap, medium squads that fit in a Technical (5 seats).
; Same pattern as 30_USA.ini. Rebels and RPG Troopers have no AutoFindHealingUpdate to remove.
; The RPG Trooper's retail object name is GLAInfantryTunnelDefender.

; =============================================================================================
; Members
; =============================================================================================

ObjectCopy IbmGLASquadRebel GLAInfantryRebel
  KindOf = +IGNORED_IN_GUI
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
  End
End

ObjectCopy IbmGLASquadRPGTrooper GLAInfantryTunnelDefender
  KindOf = +IGNORED_IN_GUI
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
  End
End

ObjectCopy IbmGLASquadStingerTrooper GLAInfantryTunnelDefender
  KindOf = +IGNORED_IN_GUI
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmGLAAntiAirMissileWeapon
  End
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
  End
End

; --- Suicide Squad members: stealthed while they hold still -----------------------------------

; Jarmen Kell's skills: long-range rifle, kill-the-driver shot, stealth.
ObjectCopy IbmGLAMarksman GLAInfantryJarmenKell
  KindOf = +IGNORED_IN_GUI
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
  End
End

; A Rebel who explodes with the Terrorist's dynamite when killed. A Detonate button needs the
; squad skill routing of a later phase.
ObjectCopy IbmGLABomber GLAInfantryRebel
  KindOf = +IGNORED_IN_GUI
  ReplaceModule ModuleTag_07        ; the Rebel's stealth needs the Camouflage upgrade; this one is innate
    Behavior = StealthUpdate IbmSquadTag_Stealth
      StealthDelay = 2000
      StealthForbiddenConditions = FIRING_PRIMARY
      HintDetectableConditions = IS_FIRING_WEAPON
      FriendlyOpacityMin = 50.0%
      FriendlyOpacityMax = 100.0%
      InnateStealth = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
    Behavior = FireWeaponWhenDeadBehavior IbmSquadTag_Dynamite
      DeathWeapon = SuicideDynamitePack
      StartsActive = Yes
      DeathTypes = ALL
    End
  End
End

ObjectCopy IbmGLASuicideRPGFighter GLAInfantryTunnelDefender
  KindOf = +IGNORED_IN_GUI
  AddModule
    Behavior = MobMemberSlavedUpdate IbmSquadTag_Member
      MustCatchUpRadius = 90
      NoNeedToCatchUpRadius = 25
      Squirrelliness = 0.05
      CatchUpCrisisBailTime = 30
    End
    Behavior = StealthUpdate IbmSquadTag_Stealth
      StealthDelay = 2000
      StealthForbiddenConditions = FIRING_PRIMARY
      HintDetectableConditions = IS_FIRING_WEAPON
      FriendlyOpacityMin = 50.0%
      FriendlyOpacityMax = 100.0%
      InnateStealth = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
End

; =============================================================================================
; Squads
; =============================================================================================

; Anti-infantry: 5 Rebels. 5 x 150 = 750, minus 10%.
ObjectCopy IbmGLARebelSquad GLAInfantryAngryMobNexus
  SelectPortrait = SURebel_L
  ButtonImage = SURebel
  UpgradeCameo1 = Upgrade_GLAAPBullets
  UpgradeCameo2 = Upgrade_GLACamouflage
  UpgradeCameo3 = Upgrade_InfantryCaptureBuilding
  UpgradeCameo4 = Upgrade_GLAInfantryRebelBoobyTrapAttack
  DisplayName = OBJECT:IbmGLARebelSquad
  Side = GLA
  RadarPriority = NOT_ON_RADAR
  WeaponSet
    Conditions = None
    Weapon = PRIMARY IbmSquadTargetGroundWeapon
  End
  BuildCost = 675
  BuildTime = 15.0
  Prerequisites
    Object = GLABarracks
  End
  CommandSet = IbmSquadCommandSet
  VoiceSelect = RebelVoiceSelect
  VoiceMove = RebelVoiceMove
  VoiceGuard = RebelVoiceMove
  VoiceAttack = RebelVoiceAttack
  SoundAmbient = NoSound
  UnitSpecificSounds
    VoiceCreate = RebelVoiceCreate
  End
  ReplaceModule ModuleTag_05
    Behavior = SpawnBehavior IbmSquadTag_Spawn
      SpawnNumber = 5
      SpawnTemplateName = IbmGLASquadRebel
      InitialBurst = 5
      OneShot = Yes
      ExitByBudding = Yes
      AggregateHealth = Yes
      SlavesHaveFreeWill = No
    End
  End
End

