; IBM Engine Squads pack: Medical Centers, where squads heal.
; Each is a copy of its faction's barracks (same model for now) that produces nothing and
; heals friendly infantry nearby. Infantry can also go inside to heal, like in a barracks.
; Reinforcing lost squad members here needs engine work in a later phase.
; The factory and barracks KindOf flags are removed so the AI and prerequisites do not mistake
; it for a barracks.

ObjectCopy IbmAmericaMedicalCenter AmericaBarracks
  SelectPortrait = SAAmbulance_L
  ButtonImage = SAAmbulance
  DisplayName = OBJECT:IbmMedicalCenter
  KindOf = -FS_BARRACKS -FS_FACTORY -AUTO_RALLYPOINT
  BuildCost = 800
  BuildTime = 15.0
  Prerequisites
    Object = AmericaBarracks
  End
  CommandSet = IbmMedicalCenterCommandSet
  AddModule
    Behavior = AutoHealBehavior IbmSquadTag_Heal
      HealingAmount = 5
      HealingDelay = 1000
      Radius = 150.0
      StartsActive = Yes
      KindOf = INFANTRY
    End
  End
End

ObjectCopy IbmChinaMedicalCenter ChinaBarracks
  SelectPortrait = SSTechHospital_L
  ButtonImage = SSTechHospital_L
  DisplayName = OBJECT:IbmMedicalCenter
  KindOf = -FS_BARRACKS -FS_FACTORY -AUTO_RALLYPOINT
  BuildCost = 800
  BuildTime = 15.0
  Prerequisites
    Object = ChinaBarracks
  End
  CommandSet = IbmMedicalCenterCommandSet
  RemoveModule ModuleTag_12         ; GenerateMinefieldBehavior (barracks mines upgrade)
  RemoveModule ModuleTag_25         ; CommandSetUpgrade would swap in the barracks buttons
  AddModule
    Behavior = AutoHealBehavior IbmSquadTag_Heal
      HealingAmount = 5
      HealingDelay = 1000
      Radius = 150.0
      StartsActive = Yes
      KindOf = INFANTRY
    End
  End
End

