; CoH GeneralsArsenal: fixed-wing aircraft and super weapons are General's powers, paid per use with
; command points earned in combat. This file is the tuning and the hidden ledger object; the other files
; are generated by Data/make_pack.py (each power's cost, rank and cooldown are set there, in POWERS).

CoHGeneralsArsenal
  ; Command points: a share of the experience value of the enemies a player's units damage and kill.
  ; A tank worth 100 experience gives 5 points over the damage that kills it and 10 for the kill.
  PointsPerKillExperience = 0.1
  PointsPerDamageExperience = 0.05
  MaxPoints = 1000

  MaxLossDelay = 300            ; s: planes lost never push a power more than this past a full cooldown
  AirfieldKinds = FS_AIRFIELD   ; a finished one standing allows the air powers
  AIRemoveFromBuildList = FS_SUPERWEAPON

  ; Skirmish AI
  AIThinkInterval = 8           ; s between picks; at most one power each time
  AIFirstUse = 120              ; s of game time before the first power
  AISuperweaponSaving = 0.3     ; once its rank allows a super weapon, keeps this share of its cost
  AIStrikeMinValue = 1200       ; build cost of enemy units a strike must hit
  AIStrikeRadius = 150
  AICoverRadius = 350           ; enemies this close to its units call for air cover

  LedgerObject = CoHCommandLedger
End

; One per game, neutral and hidden: its module keeps every player's command points (saved, in the CRC).
Object CoHCommandLedger
  KindOf = IMMOBILE NO_COLLIDE UNATTACKABLE INERT NO_SELECT IGNORED_IN_GUI
  RadarPriority = NOT_ON_RADAR
  Geometry = CYLINDER
  GeometryMajorRadius = 1.0
  GeometryHeight = 1.0
  GeometryIsSmall = Yes
  AddModule
    Body = InactiveBody ModuleTag_CoHLedgerBody
    End
    Behavior = CommandPointsLedger ModuleTag_CoHLedger
    End
  End
End
