  CreateObject
    ObjectNames           = IbmGLAAmbushStinger
    Count                 = 3
    SpreadFormation       = Yes
    MinDistanceAFormation = 20.0
    MinDistanceBFormation = 30.0
    MaxDistanceFormation  = 120.0
