; IBM Engine Squads pack: transports carry squads, not soldiers.
; A transport with N slots carries N / SlotsPerSquad squads (at least one), and each squad inside
; takes one share of the slots whatever its size. Single soldiers and vehicles still take their own
; slots, so a Troop Crawler can carry one squad plus four soldiers. Buildings and tunnels still
; count soldiers.
;
; With SlotsPerSquad = 4: Humvee, Technical, Helix, Overlord bunker and Ambulance (3 to 5 slots)
; carry 1 squad; Troop Crawler and Battle Bus (8 slots) carry 2.

IbmSquadTransport
  SlotsPerSquad = 4

  ; Transports with their own number of squads
  Transport = AmericaVehicleChinook 3
  Transport = AFG_AmericaVehicleChinook 3
  Transport = AirF_AmericaVehicleChinook 3
  Transport = Lazr_AmericaVehicleChinook 3
  Transport = SupW_AmericaVehicleChinook 3
End
