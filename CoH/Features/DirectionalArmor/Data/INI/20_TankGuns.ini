; CoH DirectionalArmor: tank guns fire high explosive, as in CoH. Each shell now splashes
; SecondaryDamage over SecondaryDamageRadius, so a shell landing among soldiers (or a miss beside one)
; still kills. Against soldiers the splash is scaled by InfantryBlast and InfantryDamage
; (10_DirectionalArmor.ini): a Crusader shell does 120 right beside it, 40 at the edge. Against vehicles
; it is just the splash: 20 is a third of a direct hit.
; DeathType EXPLODED throws the dead (the infantry's own SlowDeathBehavior with FlingForce); vehicles
; die from it as from NORMAL.
; Retail tank guns have no splash beyond their 5 primary radius (the Overlord 20 over 10).
; These are overrides: only the lines given change, and the game drops them when it ends.

