; IBM Engine Armor pack. With the Armor flag on, vehicles have front, side and rear armor and weapons
; have penetration, like in Company of Heroes. A direct hit on a vehicle penetrates with chance
;   penetration / armor of the side it hits (always, when penetration is at least the armor);
; a shot that doesn't penetrate is deflected: it does DeflectedDamage of its damage and throws sparks.
; Flank and hit the rear: a tank facing the enemy shrugs off far more.
;
; Only direct hits roll: area damage (artillery, bombs, super weapons, blasts bigger than
; DirectMaxRadius, and splash on anything but the target) always gets through. Weapons whose
; DamageType has no Penetration line and no Weapon line of their own never roll (flame, poison,
; radiation, microwaves, crushing, Jarmen Kell's pilot snipe).

IbmArmor
  DeflectedDamage = 10%
  FrontArc = 90               ; full width of the front arc, in degrees
  RearArc = 90                ; full width of the rear arc; the rest is the sides
  DirectMaxRadius = 10        ; weapons with a bigger damage radius are area weapons
  DeflectTextPenetration = 50 ; "Deflected" floats over the vehicle for weapons with at least this penetration
  DeflectFX = FX_IbmArmorDeflect

  ; Penetration by DamageType. A tank gun is 100 against a medium tank's front of about 120.
  Penetration = SMALL_ARMS 5
  Penetration = SNIPER 10
  Penetration = GATTLING 20
  Penetration = COMANCHE_VULCAN 30
  Penetration = EXPLOSION 70           ; rockets and small shells
  Penetration = ARMOR_PIERCING 100     ; tank guns
  Penetration = INFANTRY_MISSILE 110   ; anti-tank infantry
  Penetration = LASER 120
  Penetration = JET_MISSILES 140
  Penetration = STEALTHJET_MISSILES 140

  ; Penetration of single weapons. A line also covers the generals' versions ("Nuke_OverlordTankGun").
  Weapon = ScorpionTankGun 70
  Weapon = ScorpionTankGunPlusOne 80
  Weapon = MilitiaTankGun 70
  Weapon = BattleMasterTankGun 100
  Weapon = MarauderTankGun 100
  Weapon = MarauderTankGunUpgradeOne 110
  Weapon = MarauderTankGunUpgradeTwo 120
  Weapon = REDMarauderTankGun 100
  Weapon = REDMarauderTankGunUpgradeOne 110
  Weapon = REDMarauderTankGunUpgradeTwo 120
  Weapon = CrusaderTankGun 110
  Weapon = PaladinTankGun 120
  Weapon = OverlordTankGun 140
  Weapon = MissileDefenderLaserGuidedMissileWeapon 150

  ; Armor: front side rear. Units with no line of their own get the first Kind line they match.
  ; Aircraft have no armor: everything hits them in full.
  Exempt = AIRCRAFT
  Kind = VEHICLE 50 40 30

  ; USA
  Unit = AmericaVehicleHumvee          30  25  20
  Unit = AmericaVehicleMedic           30  25  20
  Unit = AmericaVehicleTomahawk        50  40  30
  Unit = AmericaTankMicrowave         100  75  50
  Unit = AmericaTankAvenger           110  80  55
  Unit = AmericaTankCrusader          120  90  60
  Unit = AmericaTankPaladin           140 100  70

  ; China
  Unit = ChinaVehicleListeningOutpost  50  40  30
  Unit = ChinaVehicleInfernoCannon     50  40  30
  Unit = ChinaVehicleTroopCrawler      60  45  35
  Unit = ChinaVehicleNukeLauncher      70  55  40
  Unit = ChinaTankGattling             80  60  40
  Unit = ChinaTankECM                  80  60  40
  Unit = ChinaTankDragon               90  70  50
  Unit = ChinaTankBattleMaster        110  80  55
  Unit = ChinaTankOverlord            180 130  90
  Unit = Tank_ChinaTankEmperor        180 130  90

  ; GLA
  Unit = GLAVehicleCombatBike          10  10  10
  Unit = GLAVehicleCombatBikeRocket    10  10  10
  Unit = GLAVehicleCombatBikeTerrorist 10  10  10
  Unit = GLAVehicleTechnical           20  15  15
  Unit = GLAVehicleRocketBuggy         20  15  15
  Unit = GLAVehicleRadarVan            20  15  15
  Unit = GLAVehicleToxinTruck          30  25  20
  Unit = GLAVehicleBombTruck           30  25  20
  Unit = GLAVehicleScudLauncher        40  30  25
  Unit = GLAVehicleQuadCannon          60  45  35
  Unit = GLAVehicleBattleBus           60  45  35
  Unit = GLATankScorpion               90  70  50
  Unit = GLATankMarauder              120  90  60
End

; Sparks where a deflected shot hits.
FXList FX_IbmArmorDeflect
  ParticleSystem
    Name = TankStruckSparks
  End
End
