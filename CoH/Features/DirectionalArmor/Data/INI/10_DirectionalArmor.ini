; CoH DirectionalArmor pack. With the DirectionalArmor flag on, vehicles have front, side and rear
; armor and weapons have penetration, like in Company of Heroes, tuned to be close to real armor.
; A hit on a vehicle penetrates with
;   chance = penetration / armor of the side it hits   (always, when penetration is at least the armor)
; and a shot that doesn't is deflected: it does DeflectedDamage of its damage, throws sparks and clangs.
; The side is where the shooter is, seen from the vehicle's hull. Flank and hit the rear.
;
; Close to real:
; - A tank's front is about twice as thick as its sides and three to four times its rear.
; - Shaped charges (rockets, missiles) penetrate the same at any range; kinetic rounds (tank shells,
;   bullets) lose penetration with range, from their near value to their far value at full range.
; - A hit on the side or rear reaches the engine, fuel and ammunition: it does more damage than one on
;   the front (FrontDamage, SideDamage, RearDamage), whether it penetrates or not.
; Rockets mostly bounce off a tank's front; from the side they mostly get through, from behind always.
; Tank guns and vehicle machine guns obliterate infantry (InfantryDamage, InfantryBlast).
; README.md has the tables, before and after.

CoHDirectionalArmor
  DeflectedDamage = 5%        ; share of a deflected shot's damage that still gets through: spalling, shock
  FrontDamage = 75%           ; a hit on the front lands softer: thick, sloped plate in front of the crew
  SideDamage = 125%           ; a hit on the side reaches the crew, ammunition and running gear
  RearDamage = 150%           ; a hit on the rear reaches the engine and fuel
  FrontArc = 90               ; full width of the front arc, degrees
  RearArc = 90                ; full width of the rear arc; the rest is the sides
  AreaRadius = 30             ; weapons with a bigger damage radius are area weapons and always get through
  DeflectFX = FX_CoHArmorDeflect
  DeflectTextPenetration = 40 ; "Deflected" floats over the vehicle for weapons with at least this near penetration

  ; ---- Penetration by DamageType: <near> <far>. A DamageType with no line never rolls (flame,
  ; poison, radiation, microwaves, crushing, pilot snipe, particle beams).
  Penetration = SMALL_ARMS        8   4      ; rifles, light machine guns: go through light vehicles only
  Penetration = SNIPER           10   8
  Penetration = GATTLING         25  12      ; gattlings, heavy machine guns
  Penetration = COMANCHE_VULCAN  35  20      ; 20 mm cannons: Humvee, Comanche
  Penetration = EXPLOSION        70  70      ; vehicle rockets and missiles: shaped charges, any range
  Penetration = INFANTRY_MISSILE 55  55      ; rocket soldiers: a Crusader's front 160 -> 34%, side 85 -> 65%
  Penetration = ARMOR_PIERCING  160 120      ; tank guns: kinetic, they lose some with range
  Penetration = LASER           160 140
  Penetration = JET_MISSILES    180 180      ; shaped charges
  Penetration = STEALTHJET_MISSILES 180 180

  ; ---- Penetration of single weapons: <weapon> <near> <far>. A line also covers the generals'
  ; versions ("BattleMasterTankGun" covers "Nuke_BattleMasterTankGun").
  Weapon = ScorpionTankGun         100  75
  Weapon = ScorpionTankGunPlusOne  110  80
  Weapon = MilitiaTankGun          100  75
  Weapon = BattleMasterTankGun     150 110
  Weapon = MarauderTankGun         150 110
  Weapon = MarauderTankGunUpgradeOne 160 120
  Weapon = MarauderTankGunUpgradeTwo 170 130
  Weapon = REDMarauderTankGun      150 110
  Weapon = REDMarauderTankGunUpgradeOne 160 120
  Weapon = REDMarauderTankGunUpgradeTwo 170 130
  Weapon = CrusaderTankGun         160 120
  Weapon = PaladinTankGun          175 135
  Weapon = OverlordTankGun         220 170
  Weapon = MissileDefenderLaserGuidedMissileWeapon 80 80   ; laser-guided: ARMOR_PIERCING, but a rocket

  ; ---- Armor: <front> <side> <rear>. A unit with no Unit line gets the first Kind line it matches,
  ; unless it is Exempt. Aircraft have none: everything hits them in full.
  Exempt = AIRCRAFT
  Kind = VEHICLE 60 40 25

  ; USA
  Unit = AmericaVehicleHumvee          15  12  10
  Unit = AmericaVehicleMedic           15  12  10
  Unit = AmericaVehicleDozer           40  30  20
  Unit = AmericaVehicleTomahawk        40  30  20
  Unit = AmericaVehicleBattleDrone     10  10  10
  Unit = AmericaVehicleSentryDrone     10  10  10
  Unit = AmericaVehicleScoutDrone      10  10  10
  Unit = AmericaVehicleSpyDrone        10  10  10
  Unit = AmericaVehicleHellfireDrone   10  10  10
  Unit = AmericaTankMicrowave         120  65  35
  Unit = AmericaTankAvenger           130  70  40
  Unit = AmericaTankCrusader          160  85  45
  Unit = AmericaTankPaladin           180  95  50

  ; China
  Unit = ChinaVehicleDozer             40  30  20
  Unit = ChinaVehicleSupplyTruck       20  15  10
  Unit = ChinaVehicleListeningOutpost  40  30  20
  Unit = ChinaVehicleInfernoCannon     40  30  20
  Unit = ChinaVehicleTroopCrawler      50  35  25
  Unit = ChinaVehicleNukeLauncher      60  40  25
  Unit = ChinaTankGattling            100  55  35
  Unit = ChinaTankECM                 100  55  35
  Unit = ChinaTankDragon              110  60  40
  Unit = ChinaTankBattleMaster        150  80  45
  Unit = ChinaTankOverlord            240 130  70
  Unit = ChinaTankEmperor             240 130  70   ; Tank_ChinaTankEmperor

  ; GLA
  Unit = GLAVehicleDozer               40  30  20
  Unit = GLAVehicleCombatBike           5   5   5
  Unit = GLAVehicleCombatBikeRocket     5   5   5
  Unit = GLAVehicleCombatBikeTerrorist  5   5   5
  Unit = GLAVehicleTechnical           10   8   8
  Unit = GLAVehicleTechnicalChassisOne 10   8   8
  Unit = GLAVehicleRocketBuggy         10   8   8
  Unit = GLAVehicleRadarVan            15  12  10
  Unit = GLAVehicleBombTruck           15  12  10
  Unit = GLAVehicleToxinTruck          20  15  10
  Unit = GLAVehicleScudLauncher        40  30  20
  Unit = GLAVehicleScudLauncherHiDef   40  30  20
  Unit = GLAVehicleQuadCannon          50  35  25
  Unit = GLAVehicleBattleBus           60  40  25
  Unit = GLATankScorpion              100  55  35
  Unit = GLALightTank                 100  55  35
  Unit = GLATankMarauder              140  75  45

  ; ---- Tanks obliterate infantry, as in CoH. Damage to infantry from vehicles' weapons, on top of the
  ; infantry's own armor (InfantryDamage = <DamageType> <percent>). Retail HumanArmor takes 10% from
  ; ARMOR_PIERCING, so 2000% makes a tank shell do twice its damage to a soldier: a direct hit kills a
  ; Rebel or Red Guard. The shells' high-explosive blast is in 20_TankGuns.ini; against soldiers it is
  ; scaled from InfantryBlast's first value just outside the direct hit to its second at the edge.
  ; Cover (05) reduces all of it for soldiers in cover; flanking rockets still kill the tank.
  InfantryDamageFrom = VEHICLE PORTABLE_STRUCTURE   ; tanks, cars and the Overlord's gattling
  InfantryDamageNotFrom = AIRCRAFT
  InfantryDamage = ARMOR_PIERCING  2000%   ; tank guns: 10% -> 200% of their damage
  InfantryDamage = SMALL_ARMS       200%   ; vehicle machine guns: Quad Cannon, combat bikes
  InfantryDamage = GATTLING         200%   ; Gattling tank, technicals, Overlord gattling
  InfantryDamage = COMANCHE_VULCAN  200%   ; Humvee, Sentry Drone
  InfantryBlast = 300% 100%               ; a Crusader shell's blast: 120 beside it, 40 at its edge

  ; ---- The skirmish AI flanks: a vehicle fighting an armored one from in front of it, where its
  ; hits get through less than FlankBelowChance of the time, drives round to its side.
  Flanking = Yes
  FlankBelowChance = 75%
  FlankMinGain = 15%          ; a hit from the flank spot must do at least this share more damage on average
  FlankRangeShare = 80%       ; the spot is this share of the attacker's range from the target
  FlankRearShare = 40%        ; 0% straight beside the target, 100% straight behind it
  FlankMaxTravel = 250        ; never drive further than this to get there (a tank gun's range is 150)
  FlankCheckEvery = 1         ; seconds
  FlankTimeout = 8            ; seconds: attack again from wherever it got to
  FlankRest = 12              ; seconds before the same vehicle flanks again
End

; Sparks off the hull and a clang where a shot bounced off
FXList FX_CoHArmorDeflect
  ParticleSystem
    Name = TankStruckSparks
  End
  ParticleSystem
    Name = FlatSparkSprayLineBurst
  End
  Sound
    Name = VehicleImpactLight
  End
End

CoHText
  Text = GUI:CoHDeflected "Deflected"
End
