; CoH Sectors: the tuning and the sector point object. The other files of this pack are generated by
; Data/make_pack.py. See CoH/Features/Sectors/README.md for what each setting does.

CoHSectors
  ; Points: every supply source and tech building on the map, merged when close together
  MergeDistance = 250.0               ; sources this close, in a chain, form one point
  HomeMergeDistance = 500.0           ; a point this close to a start position joins that home
  CellSize = 40.0                     ; the grid the map is divided on, in world units
  HomeRadius = 450.0                  ; ground this close to a start is always that home's sector

  ; Capture by conquest
  CaptureRadius = 160.0               ; units this close to a point capture it
  CaptureInterval = 0.5               ; seconds between capture steps
  CaptureSeconds = 20.0               ; one unit takes a neutral point in this time
  NeutralizeSeconds = 15.0            ; one unit neutralizes an enemy point in this time
  RecoverSeconds = 60.0               ; an empty point drifts all the way back in this time; 0: never
  MaxCapturingUnits = 5               ; more units than this don't capture faster
  ExtraUnitBonus = 0.25               ; each unit after the first adds this much speed
  CaptureKinds = INFANTRY VEHICLE     ; units of any of these kinds capture...
  NonCaptureKinds = AIRCRAFT DOZER HARVESTER DRONE ; ...unless they are any of these (take AIRCRAFT out for helicopters)
  HighValueKinds = TECH_BUILDING      ; these make a point high-value and belong to its owner

  ; Income: each held sector joined to its owner's home sector pays every IncomeSeconds. A home,
  ; three supply sectors and a high-value one pay $1,920 a minute ($2,070 before, at 75, 50 and 120):
  ; the home is worth more and each sector less, so a side that falls behind keeps a base income.
  IncomeSeconds = 10.0
  SupplyIncome = 40
  HighValueIncome = 100
  HomeIncome = 100

  ; Building
  BuildInOwnedSectorsOnly = Yes
  DefensesOnNeutralNeighbors = Yes    ; base defenses may also go in a neutral sector next to an owned one
  DefenseKinds = FS_BASE_DEFENSE

  ; Skirmish AI
  AIThinkInterval = 3.0               ; seconds between the AI's sector decisions
  AIGroupSize = 3                     ; units it sends to each target
  AIMaxTargets = 4                    ; targets it works on at once
  AIDefendWeight = 1000.0             ; one of its sectors with enemies on it
  AIReconnectWeight = 400.0           ; joins one of its cut-off sectors back up
  AIFrontierWeight = 300.0            ; borders its connected territory
  AIHighValueWeight = 150.0
  AIEnemyOwnedWeight = -50.0
  AIDistanceWeight = -200.0           ; per 1000 world units from its home
  AIRemoveFromBuildList = FS_SUPPLY_CENTER FS_SUPPLY_DROPZONE
  ; The AI scripts wait for supply buildings ("War Factory once a Supply Center is built"). Their
  ; conditions on these kinds ask about the template named with the first match replaced instead.
  AIScriptRename = SupplyCenter Barracks
  AIScriptRename = SupplyStash Barracks
  AIScriptRename = SupplyDropZone Barracks

  ; Drawing (client only)
  BorderSmoothing = 3                 ; rounding passes for border lines; 0 draws the grid's staircase
  BorderBandWidth = 40.0              ; the soft band inside an owned sector's border, world units

  PointObject = CoHSectorPoint
End

; Marks a sector point and keeps its capture state (in save games too). It is never seen or hit; the
; rings and borders are drawn by the slice's UI.
Object CoHSectorPoint
  KindOf = IMMOBILE NO_COLLIDE UNATTACKABLE INERT
  RadarPriority = NOT_ON_RADAR
  Geometry = CYLINDER
  GeometryMajorRadius = 1.0
  GeometryHeight = 1.0
  GeometryIsSmall = Yes
  AddModule
    Body = InactiveBody ModuleTag_CoHSectorBody
    End
    Behavior = SectorPointUpdate ModuleTag_CoHSectorPoint
    End
  End
End
