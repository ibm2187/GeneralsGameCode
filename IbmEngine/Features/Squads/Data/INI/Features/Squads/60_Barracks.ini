; IBM Engine Squads pack: each faction's Barracks is also its hospital. It heals friendly infantry
; nearby, and squads near it get their lost members back (IbmSquadUpdate's ReinforceAt).

Object AmericaBarracks
  AddModule
    Behavior = AutoHealBehavior IbmSquadTag_Heal
      HealingAmount = 5
      HealingDelay = 1000
      Radius = 150.0
      StartsActive = Yes
      KindOf = INFANTRY
    End
  End
End

